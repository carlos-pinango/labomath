<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Les pourcentages</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 16px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 2px solid #fcf3cf;
            padding-bottom: 10px;
        }

        h1 {
            color: #e67e22;
            margin: 0;
        }

        .lang-btn {
            border: 2px solid #f0a868;
            background: white;
            color: #e67e22;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.85em;
            border-radius: 8px;
            padding: 6px 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover { background: #fdf2e9; }

        .concept-box {
            background: #fdf2e9;
            padding: 15px;
            border-left: 5px solid #e67e22;
            margin: 20px 0;
            border-radius: 4px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        /* ── Capacity of tank B ── */
        .capacity-wrap {
            background: #fdf2e9;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }

        .chip {
            border: none;
            background: white;
            color: #7f8c8d;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85em;
            border-radius: 20px;
            padding: 5px 11px;
            cursor: pointer;
            transition: 0.2s;
        }
        .chip:hover { color: #e67e22; }
        .chip.active { background: #e67e22; color: white; }

        .num-input {
            width: 80px;
            padding: 6px 8px;
            border: 2px solid #f0a868;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1.05em;
            font-weight: 800;
            color: #e67e22;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .num-input:focus { border-color: #e67e22; }
        .num-input.invalid { border-color: #e74c3c; color: #e74c3c; }

        .unit { font-weight: 800; color: #e67e22; margin-left: -4px; }

        /* ── Tanks ── */
        .tanks-section {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: start;
            gap: 12px;
            margin-bottom: 20px;
        }

        .tank-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .panel-label {
            font-size: 0.75em;
            font-weight: 700;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        .fraction {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }
        .frac-num, .frac-den {
            font-size: 1.4em;
            font-weight: 900;
            padding: 2px 6px;
        }
        .frac-num { color: #2980b9; }
        .frac-den { color: #2c3e50; }
        .frac-bar {
            width: 100%;
            height: 2.5px;
            background: #2c3e50;
            border-radius: 2px;
        }

        /* Scale on the left + tank area */
        .tank-area {
            display: flex;
            width: 100%;
            height: 260px;
            gap: 4px;
        }

        .scale {
            position: relative;
            width: 38px;
            flex-shrink: 0;
            font-size: 0.65em;
            color: #95a5a6;
            font-weight: 600;
        }
        .scale span {
            position: absolute;
            right: 2px;
            transform: translateY(50%);
            white-space: nowrap;
        }

        .tank-slot {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            min-width: 0;
        }

        .tank {
            position: relative;
            height: 100%;
            min-width: 18px;
            border: 3px solid #5d6d7e;
            border-top: none;
            border-radius: 0 0 8px 8px;
            background:
                repeating-linear-gradient(to top,
                    transparent 0, transparent calc(10% - 1px),
                    #e5e8e8 calc(10% - 1px), #e5e8e8 10%);
            cursor: ns-resize;
            touch-action: none;
            box-sizing: border-box;
            overflow: hidden;
            transition: width 0.3s ease;
        }

        .water {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            background: linear-gradient(to top, #2e86c1, #5dade2);
            opacity: 0.9;
            transition: height 0.15s ease;
        }
        .water::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: rgba(255,255,255,0.45);
        }

        /* Dashed line showing tank A's level inside tank B */
        .guide {
            position: absolute;
            left: -2px; right: -2px;
            border-top: 2px dashed #e67e22;
            display: none;
            pointer-events: none;
            z-index: 2;
        }
        .guide.show { display: block; }

        .tank-info {
            font-size: 0.8em;
            color: #7f8c8d;
            font-weight: 600;
            text-align: center;
        }
        .tank-info strong { color: #2980b9; }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        .controls .row { display: flex; align-items: center; gap: 8px; }

        input[type="range"] {
            width: 100%;
            accent-color: #2e86c1;
            border-radius: 6px;
        }
        /* The tank the arrow keys control */
        .tank-panel.active input[type="range"] {
            outline: 2px solid #f0a868;
            outline-offset: 4px;
        }
        .tank-panel.active .panel-label { color: #e67e22; }

        /* Middle column: comparison sign */
        .compare-col {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 260px;
            margin-top: 78px;
        }
        .big-sign {
            font-size: 2.2em;
            font-weight: 900;
            color: #2c3e50;
            line-height: 1;
            min-width: 1.2em;
            text-align: center;
        }
        .big-sign.equal { color: #27ae60; }
        .big-sign.approx { color: #e67e22; }

        /* ── Result ── */
        .result-box {
            border-radius: 10px;
            padding: 14px 18px;
            text-align: center;
            line-height: 1.6;
            background: #f8f9fa;
            color: #7f8c8d;
            margin-bottom: 12px;
        }
        .result-box.equal { background: #e9f7ef; color: #1e8449; }
        .result-box.close { background: #fef9e7; color: #b9770e; }
        .result-box.approx { background: #fdf2e9; color: #a04000; }
        .result-box .calc {
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            margin-top: 6px;
        }

        /* Number line between the two reachable hundredths:
           exact value above the line, B as a dot on it, end values below */
        .nl { margin: 16px auto 4px; max-width: 340px; padding: 0 12px; }
        .nl-top { position: relative; height: 42px; }
        .nl-exact-label {
            position: absolute;
            bottom: 16px;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.8em;
            font-weight: 800;
            color: #a04000;
        }
        .nl-exact-arrow {
            position: absolute;
            bottom: 2px;
            transform: translateX(-50%);
            font-size: 0.75em;
            line-height: 1;
            color: #a04000;
        }
        .nl-track {
            position: relative;
            height: 4px;
            background: #f0a868;
            border-radius: 2px;
        }
        .nl-track::before, .nl-track::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 2px;
            height: 16px;
            background: #a04000;
        }
        .nl-track::before { left: -1px; }
        .nl-track::after { right: -1px; }
        .nl-dot {
            position: absolute;
            top: 50%;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #2e86c1;
            border: 2px solid white;
            transform: translate(-50%, -50%);
            z-index: 1;
        }
        .nl-ends {
            display: flex;
            justify-content: space-between;
            margin: 12px -12px 0;
            font-size: 0.8em;
            font-weight: 700;
        }
        .nl-ends .is-b { color: #2980b9; }

        .why-btn, .try-btn {
            border: none;
            background: white;
            color: #e67e22;
            font-family: inherit;
            font-weight: 700;
            border-radius: 8px;
            padding: 5px 12px;
            margin: 8px 4px 0;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .why-btn:hover, .try-btn:hover { background: #fcf3cf; }
        .why-box {
            text-align: left;
            background: white;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 10px;
            color: #2c3e50;
            font-size: 0.92em;
        }

        .hint-btn {
            display: block;
            margin: 0 auto;
            border: 2px dashed #e67e22;
            background: white;
            color: #e67e22;
            font-family: inherit;
            font-weight: 700;
            border-radius: 8px;
            padding: 7px 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .hint-btn:hover, .hint-btn.active { background: #fdf2e9; }

        .back-link {
            margin-top: 28px;
            text-decoration: none;
            color: #95a5a6;
            font-weight: bold;
            display: inline-block;
            transition: 0.2s;
        }
        .back-link:hover { color: #2c3e50; padding-left: 5px; }

        /* ── Mobile ── */
        @media (max-width: 560px) {
            .container { padding: 20px 16px; }
            h1 { font-size: 1.4em; }
            .tanks-section { gap: 4px; }
            .tank-area, .compare-col { height: 200px; }
            .scale { width: 30px; }
            .big-sign { font-size: 1.6em; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title-row">
        <h1 data-i18n="title">💧 Les pourcentages</h1>
        <button class="lang-btn" id="langBtn">EN</button>
    </div>

    <div class="concept-box" data-i18n-html="concept"></div>

    <!-- Capacity of tank B -->
    <div class="capacity-wrap">
        <span data-i18n="capLabel">Capacité du réservoir B :</span>
        <input type="text" inputmode="decimal" class="num-input" id="capInput" value="20">
        <span class="unit">L</span>
        <div class="chips" id="chips"></div>
    </div>

    <!-- Two tanks -->
    <div class="tanks-section">

        <div class="tank-panel" id="panelA">
            <div class="panel-label" data-i18n="tankA">Réservoir A · capacité 100 L</div>
            <div class="fraction">
                <span class="frac-num" id="numA">0</span>
                <div class="frac-bar"></div>
                <span class="frac-den">100</span>
            </div>
            <div class="tank-area">
                <div class="scale" id="scaleA"></div>
                <div class="tank-slot">
                    <div class="tank" id="tankA">
                        <div class="water" id="waterA"></div>
                    </div>
                </div>
            </div>
            <div class="tank-info" id="infoA"></div>
            <div class="controls">
                <input type="range" id="rangeA" min="0" max="100" step="0.01" value="0">
                <div class="row">
                    <input type="text" inputmode="decimal" class="num-input" id="litersA" value="0">
                    <span class="unit">L</span>
                </div>
            </div>
        </div>

        <div class="compare-col">
            <span class="big-sign" id="sign">=</span>
        </div>

        <div class="tank-panel" id="panelB">
            <div class="panel-label" id="labelB"></div>
            <div class="fraction">
                <span class="frac-num" id="numB">0</span>
                <div class="frac-bar"></div>
                <span class="frac-den" id="denB">20</span>
            </div>
            <div class="tank-area">
                <div class="scale" id="scaleB"></div>
                <div class="tank-slot">
                    <div class="tank" id="tankB">
                        <div class="water" id="waterB"></div>
                        <div class="guide" id="guideB"></div>
                    </div>
                </div>
            </div>
            <div class="tank-info" id="infoB"></div>
            <div class="controls">
                <input type="range" id="rangeB" min="0" max="20" step="0.01" value="0">
                <div class="row">
                    <input type="text" inputmode="decimal" class="num-input" id="litersB" value="0">
                    <span class="unit">L</span>
                </div>
            </div>
        </div>

    </div>

    <div class="result-box" id="result"></div>

    <button class="hint-btn" id="hintBtn" data-i18n="hintShow">💡 Montrer le niveau de A dans B</button>

    <a href="../index.html" class="back-link" data-i18n="back">← Retour à LaboMath</a>
</div>

<script>
    const CAP_A = 100;
    const PRESETS = [20, 25, 40, 50, 200, 250];
    const CLOSE_TOL = 2;

    const STR = {
        fr: {
            title: '💧 Les pourcentages',
            concept: 'Deux réservoirs rectangulaires de <strong>même hauteur</strong>. Le réservoir A a toujours une <strong>capacité de 100 L</strong> : ' +
                     'le nombre de litres qu\'il contient, c\'est directement le <strong>pourcentage</strong>. ' +
                     'Choisis la capacité du réservoir B, puis remplis chaque réservoir. ' +
                     'Quand l\'eau arrive à la <strong>même hauteur</strong>, les deux fractions sont <strong>équivalentes</strong> !',
            capLabel: 'Capacité du réservoir B :',
            tankA: 'Réservoir A · capacité 100 L',
            tankB: c => `Réservoir B · capacité ${c} L`,
            info: (l, p) => `<strong>${l} L</strong> · rempli à ${p} %`,
            equal: '✅ Fractions équivalentes ! Les deux réservoirs sont remplis à la même hauteur.',
            factor: (k, a, b, cap) => `Facteur × ${k} : &nbsp;${a} × ${k} = ${b} &nbsp;et&nbsp; 100 × ${k} = ${cap}`,
            close: 'Presque ! Les niveaux sont très proches, ajuste encore un peu.',
            aMore: (a, b) => `Le réservoir A est plus rempli (${a} % &gt; ${b} %). Ce ne sont pas des fractions équivalentes.`,
            bMore: (a, b) => `Le réservoir B est plus rempli (${b} % &gt; ${a} %). Ce ne sont pas des fractions équivalentes.`,
            hintShow: '💡 Montrer le niveau de A dans B',
            hintHide: '🙈 Cacher le niveau de A',
            hintTarget: (v, exact) => exact
                ? `Pour être équivalent, B devrait contenir ${v} L.`
                : `Pour être équivalent, B devrait contenir exactement ${v} L (impossible à atteindre avec 2 décimales).`,
            best: (t, lo, hi) =>
                `🎯 <strong>Tu es au plus près possible !</strong><br>` +
                `Pour être exactement équivalent, B devrait contenir <strong>${t} L</strong>. ` +
                `Mais on mesure seulement au centième de litre (0,01 L) : ` +
                `${lo} L, c'est un peu trop peu · ${hi} L, c'est un peu trop.`,
            approxLine: (a, b, cap) => `${a}/100 ≈ ${b}/${cap} : les fractions sont <em>presque</em> équivalentes.`,
            nlExact: 'exact',
            whyShow: '🤔 Pourquoi ?',
            whyHide: 'Masquer l\'explication',
            why: (k, cap, a, t) =>
                `La capacité de B est <strong>${k} fois</strong> celle de A (${cap} ÷ 100 = ${k}). ` +
                `Pour atteindre le même niveau, on multiplie A par ${k} : ${a} × ${k} = <strong>${t}</strong>. ` +
                `Ce résultat a plus de 2 décimales : impossible à mesurer au centième.`,
            whyStep: (cap, step) =>
                `Avec une capacité de ${cap} L, A doit être un <strong>multiple de ${step} L</strong> pour qu'une équivalence exacte soit possible.`,
            whyOnly: cap =>
                `Avec une capacité de ${cap} L, seuls A = 0 L et A = 100 L donnent une équivalence exacte au centième.`,
            tryA: v => `Essayer A = ${v} L`,
            back: '← Retour à LaboMath',
            switchTo: 'EN',
        },
        en: {
            title: '💧 Percentages',
            concept: 'Two rectangular tanks of the <strong>same height</strong>. Tank A always has a <strong>capacity of 100 L</strong>: ' +
                     'the number of liters in it is directly the <strong>percentage</strong>. ' +
                     'Choose the capacity of tank B, then fill each tank. ' +
                     'When the water reaches the <strong>same height</strong>, the two fractions are <strong>equivalent</strong>!',
            capLabel: 'Capacity of tank B:',
            tankA: 'Tank A · capacity 100 L',
            tankB: c => `Tank B · capacity ${c} L`,
            info: (l, p) => `<strong>${l} L</strong> · ${p}% full`,
            equal: '✅ Equivalent fractions! Both tanks are filled to the same height.',
            factor: (k, a, b, cap) => `Factor × ${k}: &nbsp;${a} × ${k} = ${b} &nbsp;and&nbsp; 100 × ${k} = ${cap}`,
            close: 'Almost! The levels are very close, adjust a little more.',
            aMore: (a, b) => `Tank A is fuller (${a}% &gt; ${b}%). These fractions are not equivalent.`,
            bMore: (a, b) => `Tank B is fuller (${b}% &gt; ${a}%). These fractions are not equivalent.`,
            hintShow: '💡 Show A\'s level in B',
            hintHide: '🙈 Hide A\'s level',
            hintTarget: (v, exact) => exact
                ? `To be equivalent, B should hold ${v} L.`
                : `To be equivalent, B should hold exactly ${v} L (not reachable with 2 decimals).`,
            best: (t, lo, hi) =>
                `🎯 <strong>You're as close as possible!</strong><br>` +
                `To be exactly equivalent, B should hold <strong>${t} L</strong>. ` +
                `But we only measure to the hundredth of a liter (0.01 L): ` +
                `${lo} L is slightly too little · ${hi} L is slightly too much.`,
            approxLine: (a, b, cap) => `${a}/100 ≈ ${b}/${cap}: the fractions are <em>almost</em> equivalent.`,
            nlExact: 'exact',
            whyShow: '🤔 Why?',
            whyHide: 'Hide explanation',
            why: (k, cap, a, t) =>
                `Tank B's capacity is <strong>${k} times</strong> tank A's (${cap} ÷ 100 = ${k}). ` +
                `To reach the same level, multiply A by ${k}: ${a} × ${k} = <strong>${t}</strong>. ` +
                `That result has more than 2 decimals, so it can't be measured to the hundredth.`,
            whyStep: (cap, step) =>
                `With a capacity of ${cap} L, A must be a <strong>multiple of ${step} L</strong> for an exact equivalence to be possible.`,
            whyOnly: cap =>
                `With a capacity of ${cap} L, only A = 0 L and A = 100 L give an exact equivalence to the hundredth.`,
            tryA: v => `Try A = ${v} L`,
            back: '← Back to LaboMath',
            switchTo: 'FR',
        }
    };

    const state = {
        lang: readLang(),
        capB: 20,
        vA: 35,
        vB: 5,
        hint: false,
        why: false,  // "Why?" explanation open
        active: 'A', // tank controlled by the arrow keys
    };

    function readLang() {
        try { return localStorage.getItem('labomath-lang') === 'en' ? 'en' : 'fr'; }
        catch (e) { return 'fr'; }
    }

    const $ = id => document.getElementById(id);
    const s = () => STR[state.lang];

    function fmt(n) {
        return n.toLocaleString(state.lang === 'fr' ? 'fr-CA' : 'en-CA', { maximumFractionDigits: 2 });
    }
    const round2 = n => Math.round(n * 100) / 100;

    // Value shown in a text field: decimal comma in French, point in English
    function inputVal(n) {
        const str = String(round2(n));
        return state.lang === 'fr' ? str.replace('.', ',') : str;
    }

    // Accepts both "12,5" and "12.5" (at most 2 decimals); NaN for anything else
    function parseNum(str) {
        const t = str.trim().replace(',', '.');
        return /^(\d+\.?\d{0,2}|\.\d{1,2})$/.test(t) ? Number(t) : NaN;
    }

    // Drops any digit typed after the 2nd decimal
    function limitDecimals(input) {
        const cut = input.value.replace(/([.,]\d{2})\d+/, '$1');
        if (cut !== input.value) input.value = cut;
    }
    // All amounts have at most 2 decimals, so the comparisons below work in whole
    // hundredths of a liter: integer math is exact (26.11 vs 26.1 must differ).
    const hund = n => Math.round(n * 100);

    // Writes the integer n ÷ 10^d with all its decimals (no rounding).
    // keepZeros: always show d decimals (11,10 rather than 11,1)
    function fmtExact(n, d, keepZeros) {
        const p = 10 ** d;
        let dec = String(n % p).padStart(d, '0');
        if (!keepZeros) dec = dec.replace(/0+$/, '');
        const sep = state.lang === 'fr' ? ',' : '.';
        return fmt(Math.floor(n / p)) + (dec ? sep + dec : '');
    }

    const gcd = (x, y) => y ? gcd(y, x % y) : x;

    // Everything about matching vA/100 with vB/capB
    function analyse(vA, vB, capB) {
        const a = hund(vA), b = hund(vB), c = hund(capB);
        const prod = a * c;                    // liters B needs × 1 000 000
        const lo = Math.floor(prod / 10000);   // reachable hundredths just below / above
        const reachable = prod % 10000 === 0;
        return {
            a, b, c, prod, lo, hi: lo + 1, reachable,
            equivalent: prod === b * 10000,
            best: !reachable && (b === lo || b === lo + 1),
            target: fmtExact(prod, 6),
            // A must be a multiple of this (in hundredths) for B to land on a hundredth
            stepA: 10000 / gcd(c, 10000),
        };
    }
    const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

    // ── Static text ──
    function applyLang() {
        document.documentElement.lang = state.lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const v = s()[el.dataset.i18n];
            if (typeof v === 'string') el.textContent = v;
        });
        document.querySelectorAll('[data-i18n-html]').forEach(el => {
            el.innerHTML = s()[el.dataset.i18nHtml];
        });
        document.title = s().title.replace(/^\S+\s/, '');
        $('langBtn').textContent = s().switchTo;
        renderScales();
        render();
    }

    // ── Capacity chips ──
    function renderChips() {
        $('chips').innerHTML = PRESETS.map(c =>
            `<button class="chip${c === state.capB ? ' active' : ''}" data-cap="${c}">${c} L</button>`
        ).join('');
    }

    function setCapacity(cap, source) {
        state.capB = cap;
        state.vB = Math.min(state.vB, cap);
        $('capInput').classList.remove('invalid');
        $('rangeB').max = cap;

        renderChips();
        renderScales();
        render(source);
    }

    // ── Graduations (every 10 % of capacity) ──
    function renderScales() {
        const build = cap => {
            let html = '';
            for (let i = 0; i <= 10; i += 2) {
                html += `<span style="bottom:${i * 10}%">${fmt(round2(cap * i / 10))} L</span>`;
            }
            return html;
        };
        $('scaleA').innerHTML = build(CAP_A);
        $('scaleB').innerHTML = build(state.capB);
    }

    // ── Main render ──
    function render(source) {
        const { capB, vA, vB } = state;
        const pA = vA / CAP_A * 100;
        const pB = vB / capB * 100;

        // Same height, so width is proportional to capacity
        const maxCap = Math.max(CAP_A, capB);
        $('tankA').style.width = (CAP_A / maxCap * 100) + '%';
        $('tankB').style.width = (capB / maxCap * 100) + '%';

        $('waterA').style.height = pA + '%';
        $('waterB').style.height = pB + '%';
        $('guideB').style.bottom = pA + '%';
        $('guideB').classList.toggle('show', state.hint);

        $('numA').textContent = fmt(round2(vA));
        $('numB').textContent = fmt(round2(vB));
        $('denB').textContent = fmt(capB);
        $('labelB').textContent = s().tankB(fmt(capB));

        $('infoA').innerHTML = s().info(fmt(round2(vA)), fmt(round2(pA)));
        $('infoB').innerHTML = s().info(fmt(round2(vB)), fmt(round2(pB)));

        // Sync controls (skip the one the student is typing in)
        $('rangeA').value = vA;
        $('rangeB').value = vB;
        if (source !== 'litersA') $('litersA').value = inputVal(vA);
        if (source !== 'litersB') $('litersB').value = inputVal(vB);
        if (source !== 'capInput') $('capInput').value = inputVal(capB);

        // Comparison
        const diff = pA - pB;
        const sign = $('sign');
        const box = $('result');
        box.className = 'result-box';
        sign.className = 'big-sign';

        const m = analyse(vA, vB, capB);
        const k = fmtExact(m.c, 4); // capB ÷ 100, exactly

        let html;
        if (m.equivalent) {
            sign.textContent = '=';
            sign.classList.add('equal');
            box.classList.add('equal');
            html = s().equal +
                `<div class="calc">${fmt(round2(vA))}/100 = ${fmt(round2(vB))}/${fmt(capB)}</div>` +
                `<div class="calc">${s().factor(k, fmt(round2(vA)), fmt(round2(vB)), fmt(capB))}</div>`;
        } else if (m.best) {
            sign.textContent = '≈';
            sign.classList.add('approx');
            box.classList.add('approx');
            html = s().best(m.target, fmtExact(m.lo, 2, true), fmtExact(m.hi, 2, true)) +
                `<div class="calc">${s().approxLine(fmt(round2(vA)), fmt(round2(vB)), fmt(capB))}</div>` +
                numberLine(m) + whyBlock(m, k);
        } else {
            sign.textContent = diff > 0 ? '>' : '<';
            if (Math.abs(diff) < CLOSE_TOL) {
                box.classList.add('close');
                html = s().close;
            } else {
                html = diff > 0
                    ? s().aMore(fmt(round2(pA)), fmt(round2(pB)))
                    : s().bMore(fmt(round2(pA)), fmt(round2(pB)));
            }
            if (state.hint) {
                html += `<div class="calc">${s().hintTarget(m.target, m.reachable)}</div>`;
                if (!m.reachable) html += whyBlock(m, k);
            }
        }
        box.innerHTML = html;

        const hb = $('hintBtn');
        hb.textContent = state.hint ? s().hintHide : s().hintShow;
        hb.classList.toggle('active', state.hint);
    }

    // Number line from the hundredth below to the one above the exact amount
    function numberLine(m) {
        const exactPos = (m.prod % 10000) / 100;      // % of the way from lo to hi
        const labelPos = clamp(exactPos, 25, 75);       // keep the label inside the box
        const bAtLo = m.b === m.lo;
        const end = (v, isB) => `<span${isB ? ' class="is-b"' : ''}>${isB ? 'B = ' : ''}${fmtExact(v, 2, true)} L</span>`;
        return `<div class="nl">
            <div class="nl-top">
                <span class="nl-exact-label" style="left:${labelPos}%">${m.target} L (${s().nlExact})</span>
                <span class="nl-exact-arrow" style="left:${exactPos}%">▼</span>
            </div>
            <div class="nl-track"><span class="nl-dot" style="left:${bAtLo ? 0 : 100}%"></span></div>
            <div class="nl-ends">${end(m.lo, bAtLo)}${end(m.hi, !bAtLo)}</div>
        </div>`;
    }

    // "Why?" button + explanation with values of A that do give an exact equivalence
    function whyBlock(m, k) {
        let html = `<button class="why-btn" data-action="why">${state.why ? s().whyHide : s().whyShow}</button>`;
        if (!state.why) return html;

        const cap = fmt(state.capB);
        html += `<div class="why-box">${s().why(k, cap, fmtExact(m.a, 2), m.target)}<br><br>`;
        if (m.stepA >= 10000) {
            html += s().whyOnly(cap);
        } else {
            html += s().whyStep(cap, fmtExact(m.stepA, 2));
            const down = Math.floor(m.a / m.stepA) * m.stepA;
            const tries = [down, down + m.stepA].filter(v => v > 0 && v <= 10000);
            html += '<br>' + tries.map(v =>
                `<button class="try-btn" data-action="try" data-a="${v}">${s().tryA(fmtExact(v, 2, m.stepA < 100))}</button>`
            ).join('');
        }
        return html + '</div>';
    }

    $('result').addEventListener('click', e => {
        const btn = e.target.closest('button');
        if (!btn) return;
        if (btn.dataset.action === 'why') state.why = !state.why;
        if (btn.dataset.action === 'try') { state.vA = Number(btn.dataset.a) / 100; setActive('B'); }
        render();
    });

    // ── Inputs ──
    function bindLiters(inputId, key, getCap) {
        $(inputId).addEventListener('input', e => {
            limitDecimals(e.target);
            const v = parseNum(e.target.value);
            const ok = !isNaN(v) && v <= getCap();
            e.target.classList.toggle('invalid', !ok);
            if (ok) { state[key] = v; render(inputId); }
        });
        $(inputId).addEventListener('blur', e => {
            e.target.classList.remove('invalid');
            e.target.value = inputVal(state[key]);
        });
    }
    bindLiters('litersA', 'vA', () => CAP_A);
    bindLiters('litersB', 'vB', () => state.capB);

    $('rangeA').addEventListener('input', e => {
        state.vA = clamp(round2(parseFloat(e.target.value)), 0, CAP_A);
        render();
    });
    $('rangeB').addEventListener('input', e => {
        state.vB = clamp(round2(parseFloat(e.target.value)), 0, state.capB);
        render();
    });

    // Drag the water level directly in the tank
    // Arrow keys adjust the last tank touched: ±0.01 L, with Shift ±1 L.
    // Listening on the whole page avoids relying on slider focus, which Safari doesn't give on click.
    const TANKS = {
        A: { key: 'vA', cap: () => CAP_A },
        B: { key: 'vB', cap: () => state.capB },
    };
    const ARROWS = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 };

    function setActive(tank) {
        state.active = tank;
        $('panelA').classList.toggle('active', tank === 'A');
        $('panelB').classList.toggle('active', tank === 'B');
    }

    document.addEventListener('keydown', e => {
        const dir = ARROWS[e.key];
        if (!dir || e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.target.classList && e.target.classList.contains('num-input')) return; // typing in a field
        e.preventDefault();
        const t = TANKS[state.active];
        const step = e.shiftKey ? 1 : 0.01;
        state[t.key] = clamp(round2(state[t.key] + dir * step), 0, t.cap());
        render();
    });

    ['A', 'B'].forEach(tank => {
        $('range' + tank).addEventListener('pointerdown', () => setActive(tank));
        $('range' + tank).addEventListener('focus', () => setActive(tank));
        $('liters' + tank).addEventListener('focus', () => setActive(tank));
    });

    function bindDrag(tankId, key, getCap, tankName) {
        const tank = $(tankId);
        const update = e => {
            const rect = tank.getBoundingClientRect();
            const frac = clamp(1 - (e.clientY - rect.top) / rect.height, 0, 1);
            const cap = getCap();
            const step = cap / 100;
            state[key] = clamp(round2(Math.round(frac * cap / step) * step), 0, cap);
            render();
        };
        tank.addEventListener('pointerdown', e => {
            tank.setPointerCapture(e.pointerId);
            setActive(tankName); // arrow keys can fine-tune right after dragging
            update(e);
        });
        tank.addEventListener('pointermove', e => {
            if (tank.hasPointerCapture(e.pointerId)) update(e);
        });
    }
    bindDrag('tankA', 'vA', () => CAP_A, 'A');
    bindDrag('tankB', 'vB', () => state.capB, 'B');

    $('capInput').addEventListener('input', e => {
        limitDecimals(e.target);
        const v = parseNum(e.target.value);
        const ok = !isNaN(v) && v > 0 && v <= 10000;
        e.target.classList.toggle('invalid', !ok);
        if (ok) setCapacity(v, 'capInput');
    });
    $('capInput').addEventListener('blur', e => {
        e.target.classList.remove('invalid');
        e.target.value = inputVal(state.capB);
    });

    $('chips').addEventListener('click', e => {
        const btn = e.target.closest('.chip');
        if (btn) setCapacity(parseFloat(btn.dataset.cap));
    });

    $('hintBtn').addEventListener('click', () => { state.hint = !state.hint; render(); });

    $('langBtn').addEventListener('click', () => {
        state.lang = state.lang === 'fr' ? 'en' : 'fr';
        try { localStorage.setItem('labomath-lang', state.lang); } catch (e) {}
        applyLang();
    });

    setCapacity(state.capB);
    setActive(state.active);
    applyLang();
</script>

</body>
</html>
