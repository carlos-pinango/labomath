<script>
    const M = '−';
    const BLUE = '#dbe7f6', ORANGE = '#fbe3d6', GREEN = '#dff1e6';
    const EXERCISES = [
        { q: '2y(5)', ans: '10y', L: 'y', traps: [['10y²', 'trapStrips'], ['2y + 5', 'trapAdd'], ['7y', 'trapAdd']] },
        { q: '-2x(3x)', ans: '−6x²', L: 'x', neg: true, traps: [['6x²', 'trapSign'], ['-6x', 'trapSquares']] },
        { q: '4(3b - 2)', ans: '12b − 8', L: 'b', neg: true, traps: [['12b - 2', 'trapAll'], ['12b - 6', 'trapAll']] },
    ];
    // The rectangle of parts 1 and 2: t is a length (not a, which could be read as « aire »)
    const T = 't';
    const AREA_TRAPS = [['12t', 'trapSquares'], ['7t', 'trapAdd'], ['7t²', 'trapAdd']];
    const FACTOR = [
        { a: [15, 6, 0], ans: '3(2a + 5)', L: 'a' },
        { a: [-20, 10, 0], ans: '10(y − 2)', L: 'y' },
        { a: [0, 8, 4], ans: '4(n² + 2n)', L: 'n' },
    ];

    const STR = {
        fr: {
            title: `✖️ Multiplier et diviser`,
            concept: `Une multiplication est l'<strong>aire d'un rectangle</strong> : les facteurs en sont les <strong>dimensions</strong>. Diviser, c'est le chemin inverse : on connaît l'aire et une dimension, on cherche l'autre.`,
            xLabel: `Valeur de <em>§</em>`,
            p1Title: `Constante fois expression`,
            p1Intro: `Ce rectangle a une hauteur de 3 et une base de 2<em>§</em> + 5. Il est découpé en deux parties. Trouve l'aire de chacune, puis l'aire totale.`,
            part1: `Aire de la partie 3 sur 2<em>§</em> :`, part2: `Aire de la partie 3 sur 5 :`, totalA: `Aire totale :`,
            check: `Vérifier`, reveal: `Voir la réponse`,
            readout1: (x, v) => `Avec <em>§</em> = ${x} : 3(2<em>§</em> + 5) = 3(2(${x}) + 5) = ${v}`,
            readout2: (x, v) => `6<em>§</em> + 15 = 6(${x}) + 15 = ${v}`,
            sameArea: `Déplace le curseur : les deux calculs donnent toujours la même aire.`,
            p1Ok: `✅ Bravo ! 3(2<em>§</em> + 5) = 6<em>§</em> + 15 : le 3 multiplie chaque partie de la base.`,
            partHint: `Une partie est un rectangle : son aire est hauteur fois base. Écris-la avec des parenthèses, puis réduis.`,
            totalHint: `L'aire totale est la somme des aires des deux parties.`,
            p2Title: `Monôme fois monôme`,
            p2Intro: `Ce rectangle mesure 3<em>§</em> sur 4<em>§</em>. Il est découpé en carrés de <em>§</em> sur <em>§</em>.`,
            areaQ: `Aire du rectangle 3<em>§</em> sur 4<em>§</em> :`,
            sideTitle: `Additionner ou multiplier ?`,
            sumQ: `2<em>§</em> + 3<em>§</em> =`, prodQ: `2<em>§</em>(3<em>§</em>) =`,
            sumCap: `2<em>§</em> + 3<em>§</em> : deux bandes mises bout à bout`,
            prodCap: `2<em>§</em>(3<em>§</em>) : un rectangle de 2<em>§</em> sur 3<em>§</em>`,
            cmpTitle: `2<em>§</em> et <em>§</em>²`,
            cmpText: `2<em>§</em> : deux bandes de 1 sur <em>§</em>. <em>§</em>² : un carré de <em>§</em> sur <em>§</em>.`,
            cmpVals: (x, a, b) => `Avec <em>§</em> = ${x} : 2<em>§</em> = ${a} ; <em>§</em>² = ${b}`,
            cmpEqual: `⚠️ Ici, les deux valent la même chose… mais seulement pour <em>§</em> = 2. Déplace le curseur : ce ne sont pas des expressions équivalentes.`,
            exTitle: `Exercices`,
            exIntro: `Écris chaque produit sous forme réduite.`,
            negNote: `Il y a un terme négatif : pas de rectangle ici. Vérifie plutôt avec trois valeurs de <em>§</em> de ton choix.`,
            colX: `<em>§</em>`, colStart: `Produit de départ`, colYours: `Ta réponse`,
            trapSquares: `Regarde le rectangle : il est fait de carrés de <em>§</em> sur <em>§</em>, pas de bandes.`,
            trapAdd: `Multiplier, ce n'est pas additionner : le produit est l'aire d'un rectangle dont les côtés sont les deux facteurs.`,
            trapStrips: `Un côté mesure 5, pas <em>§</em> : le rectangle est fait de bandes de 1 sur <em>§</em>, pas de carrés.`,
            trapSign: `Compare les signes dans ton tableau de valeurs : le produit de départ est-il positif ou négatif ?`,
            trapAll: `Le 4 multiplie toute l'expression 3<em>§</em> ${M} 2, donc aussi le 2. Vérifie avec ton tableau de valeurs.`,
            wrongVal: (x, a, b) => `Avec <em>§</em> = ${x}, le produit de départ vaut ${a}, mais ta réponse vaut ${b}.`,
            fbLetter: `Dans ce problème, la lettre utilisée est <em>§</em>. Que représente-t-elle ?`,
            defT: `Soit <em>t</em>, une longueur.`,
            regroupMore: `C'est équivalent, mais peux-tu regrouper encore ?`,
            ok: `✅ Bravo !`,
            okOrder: `✅ C'est juste ! On écrit habituellement les termes en ordre décroissant de degré.`,
            empty: `Écris ta réponse.`,
            times: `Pour multiplier, écris des parenthèses, comme dans 4(3<em>§</em>) : pas de ×, d'astérisque ni de point.`,
            parse: `Je ne reconnais pas cette écriture.`,
            deg: `Ici, on reste au degré 2 ou moins.`,
            answer: a => `Réponse : ${a}`,
            p3Title: `Le chemin inverse`,
            divA: `L'aire est 6<em>§</em> + 15 et la hauteur est 3. Quelle est la base ?`,
            base: `Base :`,
            divB: `(12<em>§</em> ${M} 8) ÷ 4`,
            quotient: `Quotient :`,
            verify: `Vérifie en multipliant : 4(ta réponse) =`,
            divHint: (h, a) => `Si la base était ta réponse, l'aire serait ${h} fois ta réponse. Est-ce bien ${a} ?`,
            verifyHint: `Multiplie chaque terme de ta réponse par 4.`,
            verifyOk: `✅ On retrouve 12<em>§</em> ${M} 8 : la division est vérifiée.`,
            factTitle: `Mise en évidence`,
            factIntro: `On connaît l'aire. Propose une hauteur (un nombre) : l'app dessine le rectangle et trouve la base. Plusieurs hauteurs conviennent ; cherche ensuite la plus grande hauteur entière.`,
            height: `Hauteur :`, draw: `Dessiner`,
            baseIs: (h, b) => `Avec une hauteur de ${h}, la base est ${b}.`,
            decimal: `La base aurait des coefficients décimaux. Essaie une hauteur qui donne des nombres entiers.`,
            notWhole: `Propose une hauteur entière et positive.`,
            negNoRect: `Il y a un terme négatif : pas de rectangle. Vérifie avec des valeurs : la hauteur fois la base doit redonner l'aire.`,
            valid: hs => `Hauteurs qui conviennent : ${hs}.`,
            biggest: `La plus grande hauteur entière :`,
            biggestLow: `Cette hauteur convient, mais il y en a une plus grande. Laquelle ?`,
            biggestBad: `Avec cette hauteur, la base n'a pas des coefficients entiers.`,
            write: `Écris l'aire comme hauteur(base) :`,
            onlyNumber: `Ici, la hauteur est un nombre seulement : écris un nombre devant les parenthèses.`,
            notBiggest: `Utilise la plus grande hauteur entière.`,
            notEquivF: `Ce produit ne redonne pas l'aire. Vérifie en multipliant.`,
            factOk: `✅ Bravo !`,
            form: `Écris la réponse sous la forme nombre(expression).`,
        },
        en: {
            title: `✖️ Multiplying and dividing`,
            concept: `A multiplication is the <strong>area of a rectangle</strong>: the factors are its <strong>dimensions</strong>. Dividing is the way back: we know the area and one dimension, and look for the other.`,
            xLabel: `Value of <em>§</em>`,
            p1Title: `Constant times expression`,
            p1Intro: `This rectangle has a height of 3 and a base of 2<em>§</em> + 5. It is cut into two parts. Find the area of each, then the total area.`,
            part1: `Area of the part 3 by 2<em>§</em>:`, part2: `Area of the part 3 by 5:`, totalA: `Total area:`,
            check: `Check`, reveal: `Show the answer`,
            readout1: (x, v) => `With <em>§</em> = ${x}: 3(2<em>§</em> + 5) = 3(2(${x}) + 5) = ${v}`,
            readout2: (x, v) => `6<em>§</em> + 15 = 6(${x}) + 15 = ${v}`,
            sameArea: `Move the slider: both calculations always give the same area.`,
            p1Ok: `✅ Well done! 3(2<em>§</em> + 5) = 6<em>§</em> + 15: the 3 multiplies each part of the base.`,
            partHint: `A part is a rectangle: its area is height times base. Write it with parentheses, then simplify.`,
            totalHint: `The total area is the sum of the areas of the two parts.`,
            p2Title: `Monomial times monomial`,
            p2Intro: `This rectangle measures 3<em>§</em> by 4<em>§</em>. It is cut into squares of <em>§</em> by <em>§</em>.`,
            areaQ: `Area of the rectangle 3<em>§</em> by 4<em>§</em>:`,
            sideTitle: `Add or multiply?`,
            sumQ: `2<em>§</em> + 3<em>§</em> =`, prodQ: `2<em>§</em>(3<em>§</em>) =`,
            sumCap: `2<em>§</em> + 3<em>§</em>: two strips end to end`,
            prodCap: `2<em>§</em>(3<em>§</em>): a rectangle 2<em>§</em> by 3<em>§</em>`,
            cmpTitle: `2<em>§</em> and <em>§</em>²`,
            cmpText: `2<em>§</em>: two strips of 1 by <em>§</em>. <em>§</em>²: a square of <em>§</em> by <em>§</em>.`,
            cmpVals: (x, a, b) => `With <em>§</em> = ${x}: 2<em>§</em> = ${a}; <em>§</em>² = ${b}`,
            cmpEqual: `⚠️ Here, both are worth the same… but only for <em>§</em> = 2. Move the slider: they are not equivalent expressions.`,
            exTitle: `Exercises`,
            exIntro: `Write each product in simplified form.`,
            negNote: `There is a negative term: no rectangle here. Check instead with three values of <em>§</em> of your choice.`,
            colX: `<em>§</em>`, colStart: `Starting product`, colYours: `Your answer`,
            trapSquares: `Look at the rectangle: it is made of squares of <em>§</em> by <em>§</em>, not strips.`,
            trapAdd: `Multiplying is not adding: the product is the area of a rectangle whose sides are the two factors.`,
            trapStrips: `One side measures 5, not <em>§</em>: the rectangle is made of strips of 1 by <em>§</em>, not squares.`,
            trapSign: `Compare the signs in your table of values: is the starting product positive or negative?`,
            trapAll: `The 4 multiplies the whole expression 3<em>§</em> ${M} 2, so the 2 as well. Check with your table of values.`,
            wrongVal: (x, a, b) => `With <em>§</em> = ${x}, the starting product is ${a}, but your answer is ${b}.`,
            fbLetter: `In this problem, the letter used is <em>§</em>. What does it stand for?`,
            defT: `Let <em>t</em> be a length.`,
            regroupMore: `That is equivalent, but can you group further?`,
            ok: `✅ Well done!`,
            okOrder: `✅ That's right! We usually write the terms in decreasing order of degree.`,
            empty: `Write your answer.`,
            times: `To multiply, write parentheses, as in 4(3<em>§</em>): no ×, asterisk or dot.`,
            parse: `I don't recognize this.`,
            deg: `Here we stay at degree 2 or less.`,
            answer: a => `Answer: ${a}`,
            p3Title: `The way back`,
            divA: `The area is 6<em>§</em> + 15 and the height is 3. What is the base?`,
            base: `Base:`,
            divB: `(12<em>§</em> ${M} 8) ÷ 4`,
            quotient: `Quotient:`,
            verify: `Check by multiplying: 4(your answer) =`,
            divHint: (h, a) => `If the base were your answer, the area would be ${h} times your answer. Is that ${a}?`,
            verifyHint: `Multiply each term of your answer by 4.`,
            verifyOk: `✅ We get 12<em>§</em> ${M} 8 again: the division is checked.`,
            factTitle: `Factoring out a number`,
            factIntro: `We know the area. Suggest a height (a number): the app draws the rectangle and finds the base. Several heights work; then look for the greatest whole height.`,
            height: `Height:`, draw: `Draw`,
            baseIs: (h, b) => `With a height of ${h}, the base is ${b}.`,
            decimal: `The base would have decimal coefficients. Try a height that gives whole numbers.`,
            notWhole: `Suggest a positive whole height.`,
            negNoRect: `There is a negative term: no rectangle. Check with values: height times base must give the area back.`,
            valid: hs => `Heights that work: ${hs}.`,
            biggest: `The greatest whole height:`,
            biggestLow: `This height works, but there is a greater one. Which?`,
            biggestBad: `With this height, the base does not have whole coefficients.`,
            write: `Write the area as height(base):`,
            onlyNumber: `Here the height is a number only: write a number in front of the parentheses.`,
            notBiggest: `Use the greatest whole height.`,
            notEquivF: `This product does not give the area back. Check by multiplying.`,
            factOk: `✅ Well done!`,
            form: `Write the answer in the form number(expression).`,
        },
    };

    const state = {
        lang: Langue.lang,
        x: 2.7, x2: 2.7,
        p1: { a: '', b: '', c: '', fb: null, ok: false },
        p2: { area: '', sum: '', prod: '', fb: null, fbS: null },
        ex: EXERCISES.map(() => ({ ans: '', vals: ['', '', ''], fb: null, ok: false })),
        div: { a: '', b: '', v: '', fbA: null, fbB: null, fbV: null, okA: false, okB: false },
        fact: FACTOR.map(() => ({ h: '', drawn: null, valid: [], big: '', write: '', fb: null, fbBig: null, fbW: null, okBig: false, ok: false, vals: ['', '', ''] })),
    };
    const $ = id => document.getElementById(id);
    const s = () => STR[state.lang];
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const num = v => Expr.fmtNum(v, state.lang);
    const fbHtml = f => f ? `<div class="feedback ${f.cls}">${f.html}</div>` : '';
    const pretty = t => t.replace(/([a-z])/g, '<em>$1</em>').replace(/-/g, M);
    const P = t => Expr.parse(t);
    function readNum(str) {
        const t = String(str).replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(',', '.');
        return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
    }
    const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);

    // Simplified answer equivalent to `start` (8 values, negative and decimal included)
    function judge(raw, start, traps = [], L = 'x') {
        const t = s();
        const r = P(raw);
        if (r.err === 'empty') return { cls: 'hint', html: t.empty, kind: 'empty' };
        if (r.err === 'times') return { cls: 'hint', html: t.times, kind: 'times' };
        if (r.err === 'deg') return { cls: 'hint', html: t.deg, kind: 'deg' };
        if (r.err) return { cls: 'hint', html: t.parse, kind: 'parse' };
        // Another letter than the problem's: a hint, not an error
        if (r.letters.some(x => x !== L)) return { cls: 'hint', html: t.fbLetter, kind: 'letter' };
        const S = P(start);
        if (!Expr.equivalent(r, S)) {
            const trap = traps.find(([tr]) => Expr.equivalent(r, P(tr)));
            if (trap) return { cls: 'hint', html: t[trap[1]], kind: 'trap' };
            const v = [2, 3, 5].find(w => Math.abs(Expr.value(r.ast, { [L]: w }) - Expr.value(S.ast, { [L]: w })) > 1e-9);
            return { cls: 'hint', html: t.wrongVal(v, num(Expr.value(S.ast, { [L]: v })), num(Expr.value(r.ast, { [L]: v }))), kind: 'value' };
        }
        if (!Expr.isReduced(r.ast)) return { cls: 'hint', html: t.regroupMore, kind: 'reduce' };
        return { cls: 'ok', html: Expr.isOrdered(r.ast) ? t.ok : t.okOrder, ok: true };
    }

    // ── Rectangle : hauteur h, base faite de parties [{ w, top, area, fill, grid }] (unités) ──
    function rectSvg(h, parts, o = {}) {
        const W = parts.reduce((a, p) => a + p.w, 0);
        const k = Math.min(o.maxPx || 34, (o.width || 560) / W, (o.heightPx || 220) / h);
        const L = 44, T = 30;
        let g = '', cx = L;
        parts.forEach(p => {
            const w = p.w * k;
            g += `<rect x="${cx}" y="${T}" width="${w}" height="${h * k}" fill="${p.fill}" stroke="#1f2d4d" stroke-width="2"/>`;
            (p.vlines || []).forEach(u => { g += `<line x1="${cx + u * k}" y1="${T}" x2="${cx + u * k}" y2="${T + h * k}" stroke="#1f2d4d" stroke-width="1" stroke-dasharray="4 3"/>`; });
            (p.hlines || []).forEach(u => { g += `<line x1="${cx}" y1="${T + u * k}" x2="${cx + w}" y2="${T + u * k}" stroke="#1f2d4d" stroke-width="1" stroke-dasharray="4 3"/>`; });
            g += `<text x="${cx + w / 2}" y="${T - 8}" text-anchor="middle" font-size="15" fill="#1f2d4d">${p.top}</text>`;
            if (p.area) g += `<text x="${cx + w / 2}" y="${T + h * k / 2 + 6}" text-anchor="middle" font-size="16" fill="#1f5fa8">${p.area}</text>`;
            cx += w;
        });
        g += `<text x="${L - 8}" y="${T + h * k / 2 + 5}" text-anchor="end" font-size="15" fill="#1f2d4d">${o.left}</text>`;
        return `<svg class="rect" viewBox="0 0 ${cx + 10} ${T + h * k + 10}" width="${cx + 10}" aria-hidden="true">${g}</svg>`;
    }
    // Letter x inside SVG text
    const sx = t => t.replace(/([a-z])/g, '<tspan font-family="Georgia, serif" font-style="italic">$1</tspan>').replace(/-/g, M);
    const range = (id, v) => `<div class="x-row"><label for="${id}">${s().xLabel}</label><input type="range" id="${id}" min="1" max="10" step="0.1" value="${v}"><span class="x-val"><em>t</em> = ${num(v)}</span></div>`;

    // ── Partie 1 ──
    function renderP1() {
        const t = s(), st = state.p1, x = state.x;
        const parts = [
            { w: 2 * x, top: sx('2t'), area: st.ok ? sx('6t') : '?', fill: BLUE, vlines: [x], hlines: [1, 2] },
            { w: 5, top: '5', area: st.ok ? '15' : '?', fill: ORANGE, vlines: [1, 2, 3, 4], hlines: [1, 2] },
        ];
        let h = `<p class="intro"><strong>${t.defT}</strong> ${t.p1Intro}</p>${range('x1', x)}<div class="draw" id="d1">${rectSvg(3, parts, { left: '3' })}</div>`;
        h += `<div class="readout" id="r1">${readout1()}</div>`;
        h += `<div class="row"><label for="pa">${t.part1}</label><input class="text-input" id="pa" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.a)}"></div>` +
            `<div class="row"><label for="pb">${t.part2}</label><input class="text-input" id="pb" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.b)}"></div>` +
            `<div class="row"><label for="pc">${t.totalA}</label><input class="text-input${st.ok ? ' ok-field' : ''}" id="pc" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.c)}"></div>` +
            `<div class="row"><button type="button" class="btn" id="p1Check">${t.check}</button><button type="button" class="btn light" id="p1Reveal">${t.reveal}</button></div>${fbHtml(st.fb)}`;
        $('p1').innerHTML = h.replace(/§/g, T);
    }
    function readout1() {
        const t = s(), x = state.x, v = 3 * (2 * x + 5);
        return t.readout1(num(x), num(v)) + (state.p1.ok ? `<br>${t.readout2(num(x), num(6 * x + 15))}<br><span class="note">${t.sameArea}</span>` : '');
    }
    function checkP1() {
        const t = s(), st = state.p1;
        const fa = judge(st.a, '3(2t)', [], T), fb = judge(st.b, '15', [], T), fc = judge(st.c, '3(2t+5)', [], T);
        st.ok = false;
        // Only the meaning of the area is given as a hint, never the answer
        if (!fa.ok) st.fb = fa.kind === 'value' || fa.kind === 'trap' ? { cls: 'hint', html: t.partHint } : fa;
        else if (!fb.ok) st.fb = fb.kind === 'value' ? { cls: 'hint', html: t.partHint } : fb;
        else if (!fc.ok) st.fb = fc.kind === 'value' ? { cls: 'hint', html: t.totalHint } : fc;
        else { st.ok = true; st.fb = { cls: 'ok', html: t.p1Ok }; }
        rerender(renderP1);
    }

    // ── Partie 2 ──
    function renderP2() {
        const t = s(), st = state.p2, x = state.x2;
        const grid = n => Array.from({ length: n - 1 }, (_, i) => (i + 1) * x);
        let h = `<p class="intro">${t.p2Intro}</p>${range('x2', x)}`;
        h += `<div class="draw" id="d2">${rectSvg(3 * x, [{ w: 4 * x, top: sx('4t'), area: '', fill: BLUE, vlines: grid(4), hlines: grid(3) }], { left: sx('3t'), heightPx: 200, maxPx: 16 })}</div>`;
        h += `<div class="row"><label for="area">${t.areaQ}</label><input class="text-input" id="area" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.area)}">` +
            `<button type="button" class="btn light small" data-sq="area">t²</button><button type="button" class="btn" id="areaCheck">${t.check}</button><button type="button" class="btn light" id="areaReveal">${t.reveal}</button></div>${fbHtml(st.fb)}`;
        // Add or multiply, side by side
        h += `<h3>${t.sideTitle}</h3><div class="side"><div>${rectSvg(1, [{ w: 2 * x, top: sx('2t'), area: '', fill: BLUE }, { w: 3 * x, top: sx('3t'), area: '', fill: GREEN }], { left: '1', maxPx: 12, width: 280 })}<p class="note">${t.sumCap}</p>` +
            `<div class="row"><label for="sum">${t.sumQ}</label><input class="text-input" id="sum" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.sum)}"></div></div>` +
            `<div>${rectSvg(2 * x, [{ w: 3 * x, top: sx('3t'), area: '', fill: GREEN, vlines: grid(3), hlines: grid(2) }], { left: sx('2t'), maxPx: 12, width: 280 })}<p class="note">${t.prodCap}</p>` +
            `<div class="row"><label for="prod">${t.prodQ}</label><input class="text-input" id="prod" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.prod)}"></div></div></div>` +
            `<div class="row"><button type="button" class="btn" id="sideCheck">${t.check}</button></div>${fbHtml(st.fbS)}`;
        // 2x and x²
        const eq = Math.abs(x - 2) < 1e-9;
        h += `<h3>${t.cmpTitle}</h3><div class="side"><div>${rectSvg(x, [{ w: 1, top: '1', fill: ORANGE }, { w: 1, top: '1', fill: ORANGE }], { left: sx('t'), maxPx: 30, width: 220, heightPx: 260 })}<p class="note">2<em>t</em></p></div>` +
            `<div>${rectSvg(x, [{ w: x, top: sx('t'), fill: BLUE }], { left: sx('t'), maxPx: 30, width: 220, heightPx: 260 })}<p class="note"><em>t</em>²</p></div></div>` +
            `<p class="center">${t.cmpText}</p><div class="readout">${t.cmpVals(num(x), num(2 * x), num(x * x))}</div>` + (eq ? `<p class="center warn">${t.cmpEqual}</p>` : '');
        // Exercises
        h += `<h3>${t.exTitle}</h3><p class="intro">${t.exIntro}</p>`;
        EXERCISES.forEach((ex, i) => {
            const e = state.ex[i];
            let c = `<div class="card${e.ok ? ' done' : ''}"><div class="big">${pretty(ex.q)}</div>` +
                `<div class="row"><input class="text-input${e.ok ? ' ok-field' : ''}" id="ex${i}" data-ex="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${ex.q}" value="${esc(e.ans)}">` +
                `<button type="button" class="btn light small" data-sq="ex${i}">${ex.L}²</button><button type="button" class="btn" data-excheck="${i}">${t.check}</button><button type="button" class="btn light" data-exreveal="${i}">${t.reveal}</button></div>`;
            if (ex.neg) c += `<p class="note">${t.negNote}</p><div class="table-wrap" id="tab${i}">${valTable(ex.q, e.ans, e.vals, `exv${i}`, ex.L)}</div>`;
            // Each exercise uses its own letter
            h += (c + fbHtml(e.fb) + `</div>`).replace(/§/g, ex.L);
        });
        $('p2').innerHTML = h.replace(/§/g, T);
    }
    // Table: the student's values of x, the starting product and the answer
    function valTable(start, ans, vals, key, L) {
        const t = s();
        const S = P(start), A = P(ans);
        const rows = vals.map((v, j) => {
            const x = readNum(v);
            const a = isNaN(x) ? '' : Expr.value(S.ast, { [L]: x });
            const b = isNaN(x) || A.err || A.letters.some(l => l !== L) ? '' : Expr.value(A.ast, { [L]: x });
            const cls = a === '' || b === '' ? '' : (Math.abs(a - b) < 1e-9 ? 'same' : 'diff');
            return `<tr><td><input class="num-input" data-vt="${key}" data-j="${j}" type="text" inputmode="decimal" autocomplete="off" aria-label="${L} ${j + 1}" value="${esc(v)}"></td><td>${a === '' ? '' : num(a)}</td><td class="${cls}">${b === '' ? '' : num(b)}</td></tr>`;
        }).join('');
        return `<table class="vals"><tr><th>${t.colX}</th><th class="wrap">${t.colStart}<br>${pretty(start)}</th><th class="wrap">${t.colYours}</th></tr>${rows}</table>`.replace(/§/g, L);
    }

    // ── Partie 3 ──
    function renderP3() {
        const t = s(), d = state.div, x = state.x;
        let h = `<h3>${t.divA}</h3>`;
        h += `<div class="draw">${rectSvg(3, [{ w: 2 * x + 5, top: d.okA ? sx('2t + 5') : '?', area: sx('6t + 15'), fill: BLUE }], { left: '3' })}</div>`;
        h += `<div class="row"><label for="dA">${t.base}</label><input class="text-input${d.okA ? ' ok-field' : ''}" id="dA" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d.a)}">` +
            `<button type="button" class="btn" id="dACheck">${t.check}</button><button type="button" class="btn light" id="dAReveal">${t.reveal}</button></div>${fbHtml(d.fbA)}`;
        h = h.replace(/§/g, T);
        let hb = `<h3>${t.divB}</h3><div class="row"><label for="dB">${t.quotient}</label><input class="text-input${d.okB ? ' ok-field' : ''}" id="dB" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d.b)}">` +
            `<button type="button" class="btn" id="dBCheck">${t.check}</button><button type="button" class="btn light" id="dBReveal">${t.reveal}</button></div>${fbHtml(d.fbB)}`;
        if (d.okB) hb += `<div class="row"><label for="dV">${t.verify}</label><input class="text-input" id="dV" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(d.v)}"><button type="button" class="btn" id="dVCheck">${t.check}</button></div>${fbHtml(d.fbV)}`;
        h += hb.replace(/§/g, 'k');
        h += `<h3>${t.factTitle}</h3><p class="intro">${t.factIntro}</p>`;
        let outer = h;
        FACTOR.forEach((f, i) => {
            const st = state.fact[i];
            const areaTxt = Expr.fmtPoly(f.a, f.L, state.lang);
            const neg = f.a.some(c => c < 0);
            let h = `<div class="card${st.ok ? ' done' : ''}"><div class="big">${areaTxt}</div>` +
                `<div class="row"><label for="fh${i}">${t.height}</label><input class="num-input" id="fh${i}" data-fh="${i}" type="text" inputmode="numeric" autocomplete="off" value="${esc(st.h)}"><button type="button" class="btn light" data-fdraw="${i}">${t.draw}</button></div>`;
            if (st.drawn) {
                const hh = st.drawn;
                const b = f.a.map(c => c / hh);
                h += `<p class="center">${t.baseIs(hh, Expr.fmtPoly(b, f.L, state.lang))}</p>`;
                if (b.some(c => !Number.isInteger(c))) h += `<div class="feedback hint">${t.decimal}</div>`;
                if (!neg) {
                    const parts = [];
                    if (b[2]) parts.push({ w: b[2] * x * x, top: sx(Expr.fmtPoly([0, 0, b[2]], f.L).replace(/<[^>]+>/g, '')), fill: GREEN });
                    if (b[1]) parts.push({ w: b[1] * x, top: sx(Expr.fmtPoly([0, b[1]], f.L).replace(/<[^>]+>/g, '')), fill: BLUE });
                    if (b[0]) parts.push({ w: b[0], top: num(b[0]), fill: ORANGE });
                    h += `<div class="draw">${rectSvg(hh, parts, { left: String(hh), heightPx: 160 })}</div>`;
                } else {
                    h += `<p class="note">${t.negNoRect}</p><div class="table-wrap" id="ftab${i}">${factTable(i)}</div>`;
                }
            }
            if (st.valid.length) h += `<p class="center">${t.valid(st.valid.join(state.lang === 'fr' ? ' ; ' : ', '))}</p>`;
            h += fbHtml(st.fb);
            if (st.valid.length) {
                h += `<div class="row"><label for="fb${i}">${t.biggest}</label><input class="num-input${st.okBig ? ' ok-field' : ''}" id="fb${i}" data-fb="${i}" type="text" inputmode="numeric" autocomplete="off" value="${esc(st.big)}"><button type="button" class="btn" data-fbig="${i}">${t.check}</button></div>${fbHtml(st.fbBig)}`;
            }
            if (st.okBig) h += `<div class="row"><label for="fw${i}">${t.write}</label><input class="text-input${st.ok ? ' ok-field' : ''}" id="fw${i}" data-fw="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.write)}"><button type="button" class="btn light small" data-sq="fw${i}">${f.L}²</button><button type="button" class="btn" data-fwrite="${i}">${t.check}</button></div>${fbHtml(st.fbW)}`;
            h += `<div class="center"><button type="button" class="btn light" data-freveal="${i}">${t.reveal}</button></div></div>`;
            outer += h.replace(/§/g, f.L);
        });
        $('p3').innerHTML = outer;
    }
    function factTable(i) {
        const f = FACTOR[i], st = state.fact[i], hh = st.drawn;
        const area = Expr.fmtPoly(f.a, f.L, 'fr').replace(/<[^>]+>/g, '');
        const base = f.a.map(c => c / hh);
        const prod = `${hh}(${Expr.fmtPoly(base, f.L, 'fr').replace(/<[^>]+>/g, '').replace(/,/g, '.')})`;
        return valTable(area, prod, st.vals, `fv${i}`, f.L);
    }

    function checkFactWrite(i) {
        const t = s(), f = FACTOR[i], st = state.fact[i];
        const g = f.a.reduce((a, c) => gcd(a, Math.abs(c)), 0);
        const raw = Expr.normalize(st.write);
        const m = raw.match(/^(-?[\d.,]*)([a-z²]*)\((.+)\)$/);
        const area = P(Expr.fmtPoly(f.a, f.L, 'fr').replace(/<[^>]+>/g, ''));
        const r = P(st.write);
        st.ok = false;
        if (r.err === 'empty') st.fbW = { cls: 'hint', html: t.empty };
        else if (r.err === 'times') st.fbW = { cls: 'hint', html: t.times };
        else if (!m) st.fbW = { cls: 'hint', html: t.form };
        else if (m[2]) st.fbW = { cls: 'hint', html: t.onlyNumber };
        else if (r.err) st.fbW = { cls: 'hint', html: t.parse };
        else if (r.letters.some(x => x !== f.L)) st.fbW = { cls: 'hint', html: t.fbLetter };
        else if (!Expr.equivalent(r, area)) st.fbW = { cls: 'hint', html: t.notEquivF };
        else if (readNum(m[1]) !== g) st.fbW = { cls: 'hint', html: t.notBiggest };
        else if (!Expr.isReduced(P(m[3]).ast)) st.fbW = { cls: 'hint', html: t.regroupMore };
        else { st.ok = true; st.fbW = { cls: 'ok', html: t.factOk }; }
        rerender(renderP3);
    }

    function rerender(fn) {
        const a = document.activeElement, keep = a && a.id;
        fn();
        const el = keep && $(keep);
        if (el) el.focus();
    }

    document.addEventListener('input', e => {
        const el = e.target;
        if (el.id === 'x1') { state.x = Number(el.value); renderP1(); renderP3(); $('x1').focus(); }
        else if (el.id === 'x2') { state.x2 = Number(el.value); renderP2(); $('x2').focus(); }
        else if (['pa', 'pb', 'pc'].includes(el.id)) state.p1[{ pa: 'a', pb: 'b', pc: 'c' }[el.id]] = el.value;
        else if (['area', 'sum', 'prod'].includes(el.id)) state.p2[el.id] = el.value;
        else if (el.dataset.ex) state.ex[el.dataset.ex].ans = el.value;
        else if (el.dataset.vt) {
            const key = el.dataset.vt, j = el.dataset.j;
            if (key.startsWith('exv')) {
                const i = Number(key.slice(3));
                state.ex[i].vals[j] = el.value;
                $('tab' + i).innerHTML = valTable(EXERCISES[i].q, state.ex[i].ans, state.ex[i].vals, key, EXERCISES[i].L);
            } else {
                const i = Number(key.slice(2));
                state.fact[i].vals[j] = el.value;
                $('ftab' + i).innerHTML = factTable(i);
            }
            const again = document.querySelector(`[data-vt="${key}"][data-j="${j}"]`);
            again.focus(); again.setSelectionRange(again.value.length, again.value.length);
        }
        else if (el.id === 'dA') state.div.a = el.value;
        else if (el.id === 'dB') state.div.b = el.value;
        else if (el.id === 'dV') state.div.v = el.value;
        else if (el.dataset.fh) state.fact[el.dataset.fh].h = el.value;
        else if (el.dataset.fb) state.fact[el.dataset.fb].big = el.value;
        else if (el.dataset.fw) state.fact[el.dataset.fw].write = el.value;
    });
    document.addEventListener('click', e => {
        const el = e.target, t = s();
        if (el.closest('#p1Check')) return checkP1();
        if (el.closest('#p1Reveal')) { state.p1.fb = { cls: 'info', html: t.answer(`${pretty('6x')} ; 15 ; ${pretty('6x + 15')}`) }; return rerender(renderP1); }
        if (el.closest('#areaCheck')) { state.p2.fb = judge(state.p2.area, '3t(4t)', AREA_TRAPS, T); return rerender(renderP2); }
        if (el.closest('#areaReveal')) { state.p2.fb = { cls: 'info', html: t.answer(pretty('12t²')) }; return rerender(renderP2); }
        if (el.closest('#sideCheck')) {
            const a = judge(state.p2.sum, '2t + 3t', [['6t²', 'trapAdd'], ['5t²', 'trapAdd']], T);
            const b = judge(state.p2.prod, '2t(3t)', [['5t', 'trapAdd'], ['6t', 'trapSquares'], ['5t²', 'trapAdd']], T);
            state.p2.fbS = !a.ok ? a : !b.ok ? b : { cls: 'ok', html: `✅ ${pretty('2t + 3t = 5t')} ; ${pretty('2t(3t) = 6t²')}` };
            return rerender(renderP2);
        }
        const exc = el.closest('[data-excheck]');
        if (exc) { const i = Number(exc.dataset.excheck), f = judge(state.ex[i].ans, EXERCISES[i].q, EXERCISES[i].traps, EXERCISES[i].L); state.ex[i].fb = f; state.ex[i].ok = !!f.ok; return rerender(renderP2); }
        const exr = el.closest('[data-exreveal]');
        if (exr) { state.ex[exr.dataset.exreveal].fb = { cls: 'info', html: t.answer(pretty(EXERCISES[exr.dataset.exreveal].ans)) }; return rerender(renderP2); }
        if (el.closest('#dACheck')) {
            const f = judge(state.div.a, '2t + 5', [], T);
            state.div.okA = !!f.ok;
            state.div.fbA = f.kind === 'value' ? { cls: 'hint', html: t.divHint(3, pretty('6t + 15')) } : f;
            return rerender(renderP3);
        }
        if (el.closest('#dAReveal')) { state.div.fbA = { cls: 'info', html: t.answer(pretty('2t + 5')) }; return rerender(renderP3); }
        if (el.closest('#dBCheck')) {
            const f = judge(state.div.b, '3k - 2', [], 'k');
            state.div.okB = !!f.ok;
            state.div.fbB = f.kind === 'value' ? { cls: 'hint', html: t.divHint(4, pretty('12k - 8')) } : f;
            return rerender(renderP3);
        }
        if (el.closest('#dBReveal')) { state.div.fbB = { cls: 'info', html: t.answer(pretty('3k - 2')) }; return rerender(renderP3); }
        if (el.closest('#dVCheck')) {
            const f = judge(state.div.v, '12k - 8', [], 'k');
            state.div.fbV = f.ok ? { cls: 'ok', html: t.verifyOk } : (f.kind === 'value' ? { cls: 'hint', html: t.verifyHint } : f);
            return rerender(renderP3);
        }
        const fd = el.closest('[data-fdraw]');
        if (fd) {
            const i = Number(fd.dataset.fdraw), st = state.fact[i], f = FACTOR[i];
            const hh = readNum(st.h);
            if (!Number.isInteger(hh) || hh < 1) { st.drawn = null; st.fb = { cls: 'hint', html: t.notWhole }; }
            else {
                st.drawn = hh; st.fb = null;
                if (f.a.every(c => Number.isInteger(c / hh)) && !st.valid.includes(hh)) st.valid.push(hh), st.valid.sort((a, b) => a - b);
            }
            return rerender(renderP3);
        }
        const fbg = el.closest('[data-fbig]');
        if (fbg) {
            const i = Number(fbg.dataset.fbig), st = state.fact[i], f = FACTOR[i];
            const g = f.a.reduce((a, c) => gcd(a, Math.abs(c)), 0), v = readNum(st.big);
            st.okBig = v === g;
            st.fbBig = st.okBig ? { cls: 'ok', html: `✅ ${g}` } : (Number.isInteger(v) && v > 0 && f.a.every(c => Number.isInteger(c / v)) ? { cls: 'hint', html: t.biggestLow } : { cls: 'hint', html: t.biggestBad });
            return rerender(renderP3);
        }
        const fw = el.closest('[data-fwrite]');
        if (fw) return checkFactWrite(Number(fw.dataset.fwrite));
        const frv = el.closest('[data-freveal]');
        if (frv) { state.fact[frv.dataset.freveal].fb = { cls: 'info', html: t.answer(pretty(FACTOR[frv.dataset.freveal].ans)) }; return rerender(renderP3); }
        const sq = el.closest('[data-sq]');
        if (sq) {
            const inp = $(sq.dataset.sq);
            const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
            // The ² key writes the letter of the problem
            const id = sq.dataset.sq;
            const sqL = id.startsWith('ex') ? EXERCISES[id.slice(2)].L : id.startsWith('fw') ? FACTOR[id.slice(2)].L : T;
            inp.value = inp.value.slice(0, a) + sqL + '²' + inp.value.slice(b);
            inp.dispatchEvent(new Event('input', { bubbles: true }));
            inp.focus(); inp.setSelectionRange(a + 2, a + 2);
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        const el = e.target;
        const map = { pa: 'p1Check', pb: 'p1Check', pc: 'p1Check', area: 'areaCheck', sum: 'sideCheck', prod: 'sideCheck', dA: 'dACheck', dB: 'dBCheck', dV: 'dVCheck' };
        if (map[el.id]) $(map[el.id]).click();
        else if (el.dataset.ex) document.querySelector(`[data-excheck="${el.dataset.ex}"]`).click();
        else if (el.dataset.fh) document.querySelector(`[data-fdraw="${el.dataset.fh}"]`).click();
        else if (el.dataset.fb) document.querySelector(`[data-fbig="${el.dataset.fb}"]`).click();
        else if (el.dataset.fw) checkFactWrite(Number(el.dataset.fw));
    });

    function applyLang() {
        const t = s();
        document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v; });
        document.title = t.title.replace(/^\S+\s/, '') + ' – LaboMath';
        $('concept').innerHTML = t.concept;
        state.p1.fb = null; state.p2.fb = null; state.p2.fbS = null;
        state.ex.forEach(x => { x.fb = null; });
        Object.assign(state.div, { fbA: null, fbB: null, fbV: null });
        state.fact.forEach(x => { x.fb = null; x.fbBig = null; x.fbW = null; });
        renderP1(); renderP2(); renderP3();
    }
    Langue.onChange(lang => { state.lang = lang; applyLang(); });
    applyLang();
</script>

</body>
</html>
