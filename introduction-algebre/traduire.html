<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traduire en expression – LaboMath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../commun/style.css">
    <script src="../commun/langue.js"></script>
    <script src="../commun/expressions.js"></script>
    <style>
        /* Styles propres à cette activité (le reste vient de commun/style.css) */
        [hidden] { display: none !important; }
        :root { --navy: #1f2d4d; --blue: #1f5fa8; --orange: #c84a16; --pale: #eef3fa; --line: #c9d4e5; --ok: #1e7d45; --muted: #4a5878; }
        .container { color: var(--navy); width: 100%; max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--navy); font-weight: 900; line-height: 1.2; border-bottom: 2px solid var(--pale); padding-bottom: 10px; }
        h2.step { font-size: 1.15em; font-weight: 900; margin: 34px 0 10px; padding-top: 14px; border-top: 2px solid var(--pale); color: var(--navy); }
        h2.step .num { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: var(--blue); color: white; font-size: 0.85em; margin-right: 8px; }
        h3 { font-size: 1em; font-weight: 900; margin: 14px 0 8px; }
        em { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
        p { line-height: 1.6; }
        .intro { margin: 6px 0 10px; }
        .concept-box { background: var(--pale); padding: 15px; border-left: 5px solid var(--blue); margin: 16px 0; border-radius: 4px; font-size: 0.95em; line-height: 1.6; }
        .concept-box ol { margin: 6px 0 0 22px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; font-weight: 700; margin: 8px 0; }
        .text-input, .num-input, select { padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 1.05em; font-weight: 800; color: var(--navy); background: white; outline: none; }
        .text-input { width: 200px; }
        .num-input { width: 90px; text-align: center; }
        select { font-size: 0.95em; max-width: 100%; }
        .text-input:focus, .num-input:focus, select:focus { border-color: var(--blue); }
        .ok-field { border-color: var(--ok) !important; background: #e7f4ec; }
        textarea { width: 100%; min-height: 70px; border: 2px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: inherit; font-size: 1em; color: var(--navy); resize: vertical; }
        .note { font-size: 0.85em; color: var(--muted); }
        .btn { border: none; background: var(--blue); color: white; font-family: inherit; font-weight: 800; font-size: 0.95em; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
        .btn:hover { background: #184d8a; }
        .btn.light { background: var(--pale); color: var(--blue); }
        .btn.light:hover { background: #dde7f5; }
        .center { text-align: center; margin-top: 10px; }
        .feedback { border-radius: 10px; padding: 10px 14px; line-height: 1.6; margin-top: 10px; text-align: center; }
        .feedback.hint { background: #fbeee7; color: #84300d; }
        .feedback.ok { background: #e7f4ec; color: var(--ok); }
        .feedback.info { background: var(--pale); color: var(--navy); }
        .card { border: 2px solid var(--pale); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
        .card.done { border-color: #bfe3cc; }
        .card h3 { margin-top: 0; font-size: 1.15em; }
        .pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 0 14px; }
        .stage { display: grid; grid-template-columns: 28px 1fr; gap: 4px 8px; align-items: start; margin: 10px 0; }
        .stage .n { width: 26px; height: 26px; border-radius: 50%; background: var(--pale); color: var(--blue); font-weight: 900; display: flex; align-items: center; justify-content: center; }
        .stage.done .n { background: var(--ok); color: white; }
        .stage .lbl { font-weight: 800; }
        .stage .row { justify-content: flex-start; margin: 4px 0; }
        table.cmp { border-collapse: collapse; margin: 8px auto; }
        table.cmp th, table.cmp td { border: 1px solid var(--line); padding: 6px 12px; text-align: center; font-weight: 800; }
        table.cmp th { background: var(--pale); }
        .choice { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; margin: 6px 0; }
        .choice input { accent-color: var(--blue); width: 18px; height: 18px; margin-top: 3px; }
        .big { font-size: 1.4em; font-weight: 900; text-align: center; }
        @media (max-width: 600px) {
            .container { padding: 20px 14px; }
            h1 { font-size: 1.4em; }
            .text-input { width: 170px; }
            .pair { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <a class="back-btn" href="index.html">← <span data-en="Introduction to algebra">Introduction à l'algèbre</span></a>
        <a class="logo" href="../index.html">
            <div class="logo-icon">∑</div>
            <span class="logo-text">Labo<span class="logo-accent">Math</span></span>
        </a>
        <button class="lang-btn" id="langBtn">EN</button>
    </div>
</header>

<main class="page">
<div class="container">
    <h1 data-i18n="title">✍️ Traduire en expression</h1>
    <div class="concept-box" id="concept"></div>

    <h2 class="step"><span class="num">1</span><span data-i18n="p1Title"></span></h2>
    <div id="p1"></div>

    <h2 class="step"><span class="num">2</span><span data-i18n="p2Title"></span></h2>
    <div id="p2"></div>

    <h2 class="step"><span class="num">3</span><span data-i18n="p3Title"></span></h2>
    <div id="p3"></div>
</div>
</main>

<footer class="app-footer">
    <span data-en="Designed by Carlos Pinango, engineer and high school math teacher">Conçu par Carlos Pinango, ingénieur et enseignant de mathématiques au secondaire</span>
</footer>

<script>
    const M = '−';
    // f: the value for a number ; answer: an expression in x (to show when asked)
    const ITEMS = [
        { f: n => 3 * n + 5, tries: [10], ans: '3x + 5', calc: '3(10) + 5' },
        { f: n => 3 * (n + 5), tries: [10], ans: '3(a + 5)', calc: '3(10 + 5)' },
        { f: n => n - 7, tries: [10], ans: 'y − 7', calc: '10 − 7' },
        { f: n => 7 - n, tries: [10], ans: '−t + 7', calc: '7 − 10', trap: 'x-7', order: true },
        { f: n => 2 * n, tries: [3, 10], ans: '2b', calc: '2(3)', pair: 0 },
        { f: n => n * n, tries: [3, 10], ans: 'b²', calc: '(3)²', pair: 1 },
        { f: n => n / 2, tries: [10], ans: 'k ÷ 2', calc: '10 ÷ 2' },
    ];
    const P2_EXPRS = [
        { text: '2(y − 4)', f: n => 2 * (n - 4), good: 0 },
        { text: '2y − 4', f: n => 2 * n - 4, good: 1 },
        { text: 'y² − 4', f: n => n * n - 4, good: 2 },
    ];
    const P2_SENT_F = [n => 2 * (n - 4), n => 2 * n - 4, n => n * n - 4];

    const STR = {
        fr: {
            title: `✍️ Traduire en expression`,
            concept: `Pour traduire une phrase en expression, on procède en trois temps :<ol>` +
                `<li><strong>J'essaie avec un nombre</strong> : je calcule ce que dit la phrase avec 10, par exemple.</li>` +
                `<li><strong>J'écris le calcul sans l'effectuer</strong> : 3(10) + 5 plutôt que 35.</li>` +
                `<li><strong>Je remplace le nombre par une lettre</strong> : le calcul devient une expression.</li></ol>`,
            p1Title: `Du français à l'algèbre`,
            items: [
                `le triple d'un nombre, augmenté de 5`,
                `le triple de la somme d'un nombre et de 5`,
                `un nombre diminué de 7`,
                `7 diminué d'un nombre`,
                `le double d'un nombre`,
                `le carré d'un nombre`,
                `la moitié d'un nombre`,
            ],
            st1: n => `J'essaie avec ${n}`, st2: n => `J'écris le calcul sans l'effectuer (avec ${n})`, st3: `Je remplace le nombre par une lettre`,
            res: n => `Avec ${n} :`,
            check: `Vérifier`, reveal: `Voir la réponse`,
            badNum: `Écris un nombre.`,
            s1Wrong: n => `Relis la phrase et calcule pas à pas avec ${n}.`,
            s1Trap: `7 diminué de 10 : on part de 7 et on enlève 10. Le résultat est-il positif ?`,
            s2Empty: `Écris le calcul.`,
            s2Number: `Écris le calcul, pas seulement le résultat : on doit voir les opérations.`,
            s2Letter: n => `À cette étape, on garde le nombre ${n} : la lettre viendra à l'étape 3.`,
            s2NoN: n => `Ton calcul doit contenir le nombre essayé, ${n}.`,
            s2Wrong: `Ton calcul ne donne pas le résultat de l'étape 1. Relis la phrase.`,
            s3Empty: `Écris l'expression.`,
            s3NoLetter: `Remplace le nombre par une lettre de ton choix.`,
            s3BadLetter: `Évite les lettres o, l et i : on les confond avec 0 et 1. Choisis une autre lettre.`,
            fbLetter: `Dans ce problème, la lettre utilisée est <em>p</em>. Que représente-t-elle ?`,
            p3Def: who => `Soit <em>p</em>, le nombre de points de ${who}.`,
            s3Letters: `Utilise une seule lettre pour le nombre.`,
            s3Wrong: (n, a, b) => `Essaie ton expression avec ${n} : elle donne ${a}, mais ton calcul de l'étape 1 donne ${b}.`,
            s3Order: `✅ C'est juste ! On écrit habituellement le terme avec la lettre en premier, puis le nombre.`,
            s3Ok: `✅ Bravo ! L'expression dit la même chose que la phrase.`,
            needPrev: `Fais d'abord les étapes précédentes.`,
            times: `Pour multiplier, écris des parenthèses, comme dans 3(10) : pas de ×, d'astérisque ni de point.`,
            parse: `Je ne reconnais pas cette écriture.`,
            answer: (c, e) => `Réponse : avec 10, ${c} ; avec une lettre, ${e}.`,
            pairTitle: `Le double et le carré, côte à côte`,
            pairText: `Même avec le même nombre, le double et le carré ne donnent pas la même chose : 2<em>§</em>, c'est <em>§</em> + <em>§</em> ; <em>§</em>², c'est <em>§</em>(<em>§</em>).`,
            p2Title: `De l'algèbre au français`,
            p2Intro: `Pour chaque expression, choisis la phrase qui lui correspond. Pour justifier, essaie avec un nombre : l'expression et la phrase doivent donner la même valeur.`,
            sentences: [`le double de la différence entre un nombre et 4`, `le double d'un nombre, diminué de 4`, `le carré d'un nombre, diminué de 4`],
            choose: `Choisis une phrase…`, chooseWho: `Choisis…`,
            tryWith: `J'essaie avec :`,
            p2Values: (e, n, a, b) => `Avec ${n} : l'expression ${e} donne <strong>${a}</strong> ; la phrase donne <strong>${b}</strong>.`,
            p2Pick: `Choisis d'abord une phrase.`,
            p2NeedTry: `Pour justifier, essaie avec un nombre.`,
            p2Wrong: `L'expression et la phrase ne donnent pas toujours la même valeur. Essaie avec un autre nombre et relis la phrase.`,
            p2Ok: `✅ Juste : pour chaque nombre essayé, l'expression et la phrase donnent la même valeur.`,
            p2OkOne: n => `✅ Juste ! Avec ${n}, les deux donnent la même valeur. Essaie aussi un autre nombre.`,
            p3Title: `Je choisis par où commencer`,
            p3Text: `Kim a 3 fois plus de points que Léo. Mia a 50 points de moins que Kim. Écris le nombre de points de chacun.`,
            p3Who: `De quelle personne pars-tu ?`,
            pts: who => `Points de ${who} :`,
            p3Hint: (who, a) => `Essaie ton expression : si <em>p</em> = 30, elle donne ${a} points pour ${who}. Est-ce ce que dit le texte ?`,
            p3Ok: `✅ Juste !`,
            p3Both: `Tu peux aussi essayer l'autre choix de départ.`,
            p3Q: `Quel choix te semble le plus simple ? Pourquoi ?`,
            p3Note: `Ta réponse reste sur cet écran : elle n'est ni enregistrée ni envoyée.`,
            p3Answer: (a, b) => `Réponse : ${a} ; ${b}`,
        },
        en: {
            title: `✍️ Translate into an expression`,
            concept: `To translate a sentence into an expression, we go in three steps:<ol>` +
                `<li><strong>I try with a number</strong>: I calculate what the sentence says with 10, for example.</li>` +
                `<li><strong>I write the calculation without doing it</strong>: 3(10) + 5 rather than 35.</li>` +
                `<li><strong>I replace the number with a letter</strong>: the calculation becomes an expression.</li></ol>`,
            p1Title: `From words to algebra`,
            items: [
                `three times a number, increased by 5`,
                `three times the sum of a number and 5`,
                `a number decreased by 7`,
                `7 decreased by a number`,
                `double a number`,
                `the square of a number`,
                `half a number`,
            ],
            st1: n => `I try with ${n}`, st2: n => `I write the calculation without doing it (with ${n})`, st3: `I replace the number with a letter`,
            res: n => `With ${n}:`,
            check: `Check`, reveal: `Show the answer`,
            badNum: `Write a number.`,
            s1Wrong: n => `Read the sentence again and calculate step by step with ${n}.`,
            s1Trap: `7 decreased by 10: start from 7 and take away 10. Is the result positive?`,
            s2Empty: `Write the calculation.`,
            s2Number: `Write the calculation, not only the result: we must see the operations.`,
            s2Letter: n => `At this step, keep the number ${n}: the letter comes in step 3.`,
            s2NoN: n => `Your calculation must contain the number tried, ${n}.`,
            s2Wrong: `Your calculation does not give the result of step 1. Read the sentence again.`,
            s3Empty: `Write the expression.`,
            s3NoLetter: `Replace the number with a letter of your choice.`,
            s3BadLetter: `Avoid the letters o, l and i: they look like 0 and 1. Choose another letter.`,
            fbLetter: `In this problem, the letter used is <em>p</em>. What does it stand for?`,
            p3Def: who => `Let <em>p</em> be the number of points ${who} has.`,
            s3Letters: `Use only one letter for the number.`,
            s3Wrong: (n, a, b) => `Try your expression with ${n}: it gives ${a}, but your calculation in step 1 gives ${b}.`,
            s3Order: `✅ That's right! We usually write the term with the letter first, then the number.`,
            s3Ok: `✅ Well done! The expression says the same thing as the sentence.`,
            needPrev: `First do the previous steps.`,
            times: `To multiply, write parentheses, as in 3(10): no ×, asterisk or dot.`,
            parse: `I don't recognize this.`,
            answer: (c, e) => `Answer: with 10, ${c}; with a letter, ${e}.`,
            pairTitle: `Double and square, side by side`,
            pairText: `Even with the same number, double and square do not give the same thing: 2<em>§</em> is <em>§</em> + <em>§</em>; <em>§</em>² is <em>§</em>(<em>§</em>).`,
            p2Title: `From algebra to words`,
            p2Intro: `For each expression, choose the sentence that matches it. To justify, try with a number: the expression and the sentence must give the same value.`,
            sentences: [`double the difference between a number and 4`, `double a number, decreased by 4`, `the square of a number, decreased by 4`],
            choose: `Choose a sentence…`, chooseWho: `Choose…`,
            tryWith: `I try with:`,
            p2Values: (e, n, a, b) => `With ${n}: the expression ${e} gives <strong>${a}</strong>; the sentence gives <strong>${b}</strong>.`,
            p2Pick: `First choose a sentence.`,
            p2NeedTry: `To justify, try with a number.`,
            p2Wrong: `The expression and the sentence do not always give the same value. Try another number and read the sentence again.`,
            p2Ok: `✅ Right: for each number tried, the expression and the sentence give the same value.`,
            p2OkOne: n => `✅ Right! With ${n}, both give the same value. Also try another number.`,
            p3Title: `I choose where to start`,
            p3Text: `Kim has 3 times as many points as Léo. Mia has 50 points fewer than Kim. Write the number of points of each one.`,
            p3Who: `Which person do you start from?`,
            pts: who => `${who}'s points:`,
            p3Hint: (who, a) => `Try your expression: if <em>p</em> = 30, it gives ${a} points for ${who}. Is that what the text says?`,
            p3Ok: `✅ Right!`,
            p3Both: `You can also try the other starting choice.`,
            p3Q: `Which choice seems simpler to you? Why?`,
            p3Note: `Your answer stays on this screen: it is not saved or sent.`,
            p3Answer: (a, b) => `Answer: ${a}; ${b}`,
        },
    };

    const state = {
        lang: Langue.lang,
        items: ITEMS.map(it => ({ tries: it.tries.map(() => ''), calc: '', expr: '', stage: 0, fb: null })),
        p2: P2_EXPRS.map(() => ({ sent: '', tryv: '', tried: [], fb: null })),
        p3: { who: '', a: '', b: '', fb: {}, ok: {}, why: '' },
    };
    const $ = id => document.getElementById(id);
    const s = () => STR[state.lang];
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const num = v => Expr.fmtNum(v, state.lang);
    const fbHtml = f => f ? `<div class="feedback ${f.cls}">${f.html}</div>` : '';
    const pretty = t => t.replace(/([a-z])/g, '<em>$1</em>').replace(/-/g, M);
    function readNum(str) {
        const t = String(str).replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(',', '.');
        return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
    }
    // Student expression in one letter compared with f on 8 values (negative and decimal included)
    function sameAs(r, f) {
        const L = r.letters[0];
        return Expr.SAMPLES.every(v => Math.abs(Expr.value(r.ast, { [L]: v }) - f(v)) < 1e-9);
    }

    // ── Partie 1 ──
    // Letter the student chose for the double and the square (used in their comparison table)
    function pairLetter() {
        const r = Expr.parse(state.items[4].expr);
        return !r.err && r.letters.length === 1 ? r.letters[0] : 'x';
    }
    function itemHtml(i) {
        const t = s(), it = ITEMS[i], st = state.items[i];
        const n0 = it.tries[0];
        const stage = (k, lbl, body) => `<div class="stage${st.stage > k ? ' done' : ''}"><span class="n">${k + 1}</span><div><div class="lbl">${lbl}</div>${body}</div></div>`;
        let h = `<div class="card${st.stage >= 3 ? ' done' : ''}"><h3>« ${t.items[i]} »</h3>`;
        h += stage(0, t.st1(it.tries.join(state.lang === 'fr' ? ' et ' : ' and ')), it.tries.map((n, k) =>
            `<div class="row"><label for="try${i}-${k}">${t.res(n)}</label><input class="num-input${st.stage > 0 ? ' ok-field' : ''}" id="try${i}-${k}" data-try="${i}" data-k="${k}" type="text" inputmode="decimal" autocomplete="off" value="${esc(st.tries[k])}"></div>`).join(''));
        h += stage(1, t.st2(n0), `<div class="row"><input class="text-input${st.stage > 1 ? ' ok-field' : ''}" id="calc${i}" data-calc="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${t.st2(n0)}" value="${esc(st.calc)}"></div>`);
        h += stage(2, t.st3, `<div class="row"><input class="text-input${st.stage > 2 ? ' ok-field' : ''}" id="expr${i}" data-expr="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${t.st3}" value="${esc(st.expr)}"></div>`);
        h += `<div class="row"><button type="button" class="btn" data-check="${i}">${t.check}</button><button type="button" class="btn light" data-reveal="${i}">${t.reveal}</button></div>${fbHtml(st.fb)}</div>`;
        return h;
    }
    function renderP1() {
        const t = s();
        let h = '';
        ITEMS.forEach((it, i) => {
            if (it.pair === 0) {
                const done = state.items[i].stage >= 3 && state.items[i + 1].stage >= 3;
                h += `<h3>${t.pairTitle}</h3><div class="pair">${itemHtml(i)}${itemHtml(i + 1)}</div>`;
                if (done) h += `<table class="cmp"><tr><th></th><th>3</th><th>10</th></tr>` +
                    (`<tr><th>2<em>§</em></th><td>2(3) = 6</td><td>2(10) = 20</td></tr><tr><th><em>§</em>²</th><td>(3)² = 9</td><td>(10)² = 100</td></tr></table><p class="center">${t.pairText}</p>`).replace(/§/g, pairLetter());
            } else if (it.pair !== 1) h += itemHtml(i);
        });
        $('p1').innerHTML = h;
    }
    function checkItem(i) {
        const t = s(), it = ITEMS[i], st = state.items[i];
        st.stage = 0;
        // Stage 1: the value(s) with the number tried
        for (let k = 0; k < it.tries.length; k++) {
            const v = readNum(st.tries[k]), n = it.tries[k];
            if (isNaN(v)) { st.fb = { cls: 'hint', html: t.badNum }; return rerender(renderP1); }
            if (Math.abs(v - it.f(n)) > 1e-9) { st.fb = { cls: 'hint', html: it.trap && v === -it.f(n) ? t.s1Trap : t.s1Wrong(n) }; return rerender(renderP1); }
        }
        st.stage = 1;
        // Stage 2: the calculation, not done
        const n0 = it.tries[0];
        const c = Expr.parse(st.calc);
        let msg = null;
        if (c.err === 'empty') msg = t.s2Empty;
        else if (c.err === 'times') msg = t.times;
        else if (c.err) msg = t.parse;
        else if (c.letters.length) msg = t.s2Letter(n0);
        else if (c.ast.t === 'num') msg = t.s2Number;
        else if (!new RegExp(`(^|[^\\d.,])${n0}([^\\d.,]|$)`).test(Expr.normalize(st.calc))) msg = t.s2NoN(n0);
        else if (Math.abs(Expr.value(c.ast, {}) - it.f(n0)) > 1e-9) msg = t.s2Wrong;
        if (msg) { st.fb = { cls: 'hint', html: msg }; return rerender(renderP1); }
        st.stage = 2;
        // Stage 3: the expression with a letter
        const r = Expr.parse(st.expr);
        if (r.err === 'empty') msg = t.s3Empty;
        else if (r.err === 'times') msg = t.times;
        else if (r.err) msg = t.parse;
        else if (!r.letters.length) msg = t.s3NoLetter;
        else if (r.letters.length > 1) msg = t.s3Letters;
        else if (/[oli]/.test(r.letters[0])) msg = t.s3BadLetter;
        else if (!sameAs(r, it.f)) {
            const L = r.letters[0];
            msg = t.s3Wrong(n0, num(Expr.value(r.ast, { [L]: n0 })), num(it.f(n0)));
        }
        if (msg) { st.fb = { cls: 'hint', html: msg }; return rerender(renderP1); }
        st.stage = 3;
        st.fb = { cls: 'ok', html: it.order && !Expr.isOrdered(r.ast) ? t.s3Order : t.s3Ok };
        rerender(renderP1);
    }

    // ── Partie 2 ──
    function renderP2() {
        const t = s();
        let h = `<p class="intro">${t.p2Intro}</p>`;
        P2_EXPRS.forEach((ex, i) => {
            const st = state.p2[i];
            const vals = st.tried.map(n => `<div>${t.p2Values(pretty(ex.text), num(n), num(ex.f(n)), st.sent === '' ? '—' : num(P2_SENT_F[st.sent](n)))}</div>`).join('');
            h += `<div class="card${st.fb && st.fb.cls === 'ok' ? ' done' : ''}"><div class="big">${pretty(ex.text)}</div>` +
                `<div class="row"><select id="sent${i}" data-sent="${i}" aria-label="${t.choose}"><option value="">${t.choose}</option>` +
                t.sentences.map((x, k) => `<option value="${k}"${st.sent === k ? ' selected' : ''}>${x}</option>`).join('') + `</select></div>` +
                `<div class="row"><label for="tv${i}">${t.tryWith}</label><input class="num-input" id="tv${i}" data-tv="${i}" type="text" inputmode="decimal" autocomplete="off" value="${esc(st.tryv)}">` +
                `<button type="button" class="btn" data-p2="${i}">${t.check}</button></div><div class="center">${vals}</div>${fbHtml(st.fb)}</div>`;
        });
        $('p2').innerHTML = h;
    }
    function checkP2(i) {
        const t = s(), st = state.p2[i], ex = P2_EXPRS[i];
        const n = readNum(st.tryv);
        if (!isNaN(n) && !st.tried.includes(n)) st.tried.push(n);
        if (st.sent === '') st.fb = { cls: 'hint', html: t.p2Pick };
        else if (!st.tried.length) st.fb = { cls: 'hint', html: t.p2NeedTry };
        else if (st.sent !== ex.good) st.fb = { cls: 'hint', html: t.p2Wrong };
        else st.fb = { cls: 'ok', html: st.tried.length > 1 ? t.p2Ok : t.p2OkOne(num(st.tried[0])) };
        rerender(renderP2);
    }

    // ── Partie 3 ──
    // Points of each person as a function of x, for each starting choice
    const P3 = {
        leo: { others: ['kim', 'mia'], f: { kim: x => 3 * x, mia: x => 3 * x - 50 }, ans: { kim: '3p', mia: '3p − 50' } },
        kim: { others: ['leo', 'mia'], f: { leo: x => x / 3, mia: x => x - 50 }, ans: { leo: 'p ÷ 3', mia: 'p − 50' } },
    };
    const NAMES = { leo: 'Léo', kim: 'Kim', mia: 'Mia' };
    function renderP3() {
        const t = s(), st = state.p3;
        let h = `<div class="concept-box" style="font-weight:700">${t.p3Text}</div>`;
        h += `<div class="row"><label for="who">${t.p3Who}</label><select id="who"><option value="">${t.chooseWho}</option>` +
            ['leo', 'kim'].map(w => `<option value="${w}"${st.who === w ? ' selected' : ''}>${NAMES[w]}</option>`).join('') + `</select></div>`;
        if (st.who) {
            const cfg = P3[st.who];
            h += `<p class="center"><strong>${t.p3Def(NAMES[st.who])}</strong></p>`;
            cfg.others.forEach(o => {
                h += `<div class="row"><label for="pt-${o}">${t.pts(NAMES[o])}</label><input class="text-input${st.ok[o] ? ' ok-field' : ''}" id="pt-${o}" data-pt="${o}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st[o] || '')}"></div>${fbHtml(st.fb[o])}`;
            });
            h += `<div class="row"><button type="button" class="btn" id="p3Check">${t.check}</button><button type="button" class="btn light" id="p3Reveal">${t.reveal}</button></div>${fbHtml(st.fb.all)}`;
            if (cfg.others.every(o => st.ok[o])) h += `<h3><label for="why">${t.p3Q}</label></h3><textarea id="why">${esc(st.why)}</textarea><p class="note">${t.p3Note}</p>`;
        }
        $('p3').innerHTML = h;
    }
    function checkP3() {
        const t = s(), st = state.p3, cfg = P3[st.who];
        st.fb = {};
        cfg.others.forEach(o => {
            const r = Expr.parse(st[o] || '');
            st.ok[o] = false;
            if (r.err === 'empty') st.fb[o] = { cls: 'hint', html: t.s3Empty };
            else if (r.err === 'times') st.fb[o] = { cls: 'hint', html: t.times };
            else if (r.err) st.fb[o] = { cls: 'hint', html: t.parse };
            else if (!r.letters.length) st.fb[o] = { cls: 'hint', html: t.s3NoLetter };
            else if (r.letters.length !== 1 || r.letters[0] !== 'p') st.fb[o] = { cls: 'hint', html: t.fbLetter };
            else if (!sameAs(r, cfg.f[o])) st.fb[o] = { cls: 'hint', html: t.p3Hint(NAMES[o], num(Expr.value(r.ast, { p: 30 }))) };
            else { st.ok[o] = true; st.fb[o] = { cls: 'ok', html: t.p3Ok }; }
        });
        if (cfg.others.every(o => st.ok[o])) st.fb.all = { cls: 'info', html: t.p3Both };
        rerender(renderP3);
    }

    function rerender(fn) {
        const a = document.activeElement, keep = a && a.id;
        fn();
        const el = keep && $(keep);
        if (el) el.focus();
    }

    document.addEventListener('input', e => {
        const el = e.target;
        if (el.dataset.try) state.items[el.dataset.try].tries[el.dataset.k] = el.value;
        else if (el.dataset.calc) state.items[el.dataset.calc].calc = el.value;
        else if (el.dataset.expr) state.items[el.dataset.expr].expr = el.value;
        else if (el.dataset.tv) state.p2[el.dataset.tv].tryv = el.value;
        else if (el.dataset.pt) state.p3[el.dataset.pt] = el.value;
        else if (el.id === 'why') state.p3.why = el.value;
    });
    document.addEventListener('change', e => {
        const el = e.target;
        if (el.dataset.sent) { state.p2[el.dataset.sent].sent = el.value === '' ? '' : Number(el.value); rerender(renderP2); }
        else if (el.id === 'who') { state.p3.who = el.value; state.p3.fb = {}; state.p3.ok = {}; rerender(renderP3); }
    });
    document.addEventListener('click', e => {
        const el = e.target, t = s();
        const c = el.closest('[data-check]');
        if (c) return checkItem(Number(c.dataset.check));
        const r = el.closest('[data-reveal]');
        if (r) { const it = ITEMS[r.dataset.reveal]; state.items[r.dataset.reveal].fb = { cls: 'info', html: t.answer(pretty(it.calc), pretty(it.ans)) }; return rerender(renderP1); }
        const p2 = el.closest('[data-p2]');
        if (p2) return checkP2(Number(p2.dataset.p2));
        if (el.closest('#p3Check')) return checkP3();
        if (el.closest('#p3Reveal')) {
            const cfg = P3[state.p3.who];
            state.p3.fb.all = { cls: 'info', html: t.p3Answer(...cfg.others.map(o => `${NAMES[o]} : ${pretty(cfg.ans[o])}`)) };
            return rerender(renderP3);
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        const el = e.target;
        const i = el.dataset.try ?? el.dataset.calc ?? el.dataset.expr;
        if (i !== undefined) checkItem(Number(i));
        else if (el.dataset.tv) checkP2(Number(el.dataset.tv));
        else if (el.dataset.pt) checkP3();
    });

    function applyLang() {
        const t = s();
        document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v; });
        document.title = t.title.replace(/^\S+\s/, '') + ' – LaboMath';
        $('concept').innerHTML = t.concept;
        state.items.forEach(x => { x.fb = null; });
        state.p2.forEach(x => { x.fb = null; });
        state.p3.fb = {};
        renderP1(); renderP2(); renderP3();
    }
    Langue.onChange(lang => { state.lang = lang; applyLang(); });
    applyLang();
</script>

</body>
</html>
