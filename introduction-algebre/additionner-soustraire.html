<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additionner et soustraire – LaboMath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../commun/style.css">
    <script src="../commun/langue.js"></script>
    <script src="../commun/expressions.js"></script>
    <style>
        /* Styles propres à cette activité (le reste vient de commun/style.css) */
        [hidden] { display: none !important; }
        :root { --navy: #1f2d4d; --blue: #1f5fa8; --orange: #c84a16; --pale: #eef3fa; --line: #c9d4e5; --ok: #1e7d45; --muted: #4a5878; }
        .container { color: var(--navy); width: 100%; max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: var(--navy); font-weight: 900; line-height: 1.2; border-bottom: 2px solid var(--pale); padding-bottom: 10px; }
        h2.step { font-size: 1.15em; font-weight: 900; margin: 34px 0 10px; padding-top: 14px; border-top: 2px solid var(--pale); color: var(--navy); }
        h2.step .num { display: inline-flex; width: 28px; height: 28px; align-items: center; justify-content: center; border-radius: 50%; background: var(--blue); color: white; font-size: 0.85em; margin-right: 8px; }
        h3 { font-size: 1em; font-weight: 900; margin: 14px 0 8px; }
        em { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
        p { line-height: 1.6; }
        .intro { margin: 6px 0 10px; }
        .concept-box { background: var(--pale); padding: 15px; border-left: 5px solid var(--blue); margin: 16px 0; border-radius: 4px; font-size: 0.95em; line-height: 1.6; }
        .row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 10px; font-weight: 700; margin: 8px 0; }
        .text-input, .num-input { padding: 6px 10px; border: 2px solid var(--line); border-radius: 8px; font-family: inherit; font-size: 1.05em; font-weight: 800; color: var(--navy); background: white; outline: none; }
        .text-input { width: 200px; }
        .num-input { width: 80px; text-align: center; }
        .text-input:focus, .num-input:focus { border-color: var(--blue); }
        .ok-field { border-color: var(--ok) !important; background: #e7f4ec; }
        .btn { border: none; background: var(--blue); color: white; font-family: inherit; font-weight: 800; font-size: 0.95em; border-radius: 20px; padding: 8px 16px; cursor: pointer; }
        .btn:hover { background: #184d8a; }
        .btn.light { background: var(--pale); color: var(--blue); }
        .btn.light:hover { background: #dde7f5; }
        .btn.small { padding: 5px 12px; font-size: 0.85em; }
        .center { text-align: center; margin-top: 10px; }
        .feedback { border-radius: 10px; padding: 10px 14px; line-height: 1.6; margin-top: 10px; text-align: center; }
        .feedback.hint { background: #fbeee7; color: #84300d; }
        .feedback.ok { background: #e7f4ec; color: var(--ok); }
        .feedback.info { background: var(--pale); color: var(--navy); }
        .card { border: 2px solid var(--pale); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
        .card.done { border-color: #bfe3cc; }
        .card h3 { margin-top: 0; font-size: 1.15em; }
        .big { font-size: 1.4em; font-weight: 900; text-align: center; }
        .n-row { display: flex; align-items: center; gap: 12px; font-weight: 800; max-width: 520px; margin: 0 auto 10px; }
        .n-row input[type=range] { flex: 1; accent-color: var(--blue); min-width: 0; }
        .groups { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; align-items: stretch; }
        .group { border: 2px dashed var(--line); border-radius: 12px; padding: 8px 10px; text-align: center; min-width: 140px; }
        .group .cap { font-weight: 900; margin-top: 4px; }
        .group.minus { border-color: var(--orange); }
        .op { display: flex; align-items: center; font-size: 2em; font-weight: 900; }
        svg.items { display: block; margin: 0 auto; max-width: 100%; height: auto; }
        svg.tri { display: block; margin: 0 auto; width: 100%; max-width: 280px; height: auto; }
        .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; font-weight: 700; font-size: 0.9em; margin-top: 6px; }
        @media (max-width: 600px) {
            .container { padding: 20px 14px; }
            h1 { font-size: 1.4em; }
            .text-input { width: 175px; }
            .group { min-width: 0; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <a class="back-btn" href="index.html">← <span data-en="Introduction to algebra">Introduction à l'algèbre</span></a>
        <a class="logo" href="../index.html">
            <div class="logo-icon">∑</div>
            <span class="logo-text">Labo<span class="logo-accent">Math</span></span>
        </a>
        <button class="lang-btn" id="langBtn">EN</button>
    </div>
</header>

<main class="page">
<div class="container">
    <h1 data-i18n="title">➕ Additionner et soustraire</h1>
    <div class="concept-box" id="concept"></div>

    <h2 class="step"><span class="num">1</span><span data-i18n="p1Title"></span></h2>
    <div id="p1"></div>

    <h2 class="step"><span class="num">2</span><span data-i18n="p2Title"></span></h2>
    <div id="p2"></div>

    <h2 class="step"><span class="num">3</span><span data-i18n="p3Title"></span></h2>
    <div id="p3"></div>

    <h2 class="step"><span class="num">4</span><span data-i18n="p4Title"></span></h2>
    <div id="p4"></div>
</div>
</main>

<footer class="app-footer">
    <span data-en="Designed by Carlos Pinango, engineer and high school math teacher">Conçu par Carlos Pinango, ingénieur et enseignant de mathématiques au secondaire</span>
</footer>

<script>
    const M = '−';
    // Part 3: start expression (as typed) and the simplified answer (shown only on request)
    const P3 = [
        { q: '4a + 3a − a', ans: '6a', L: 'a' },
        { q: '3y² + 2y − y² + 5y', ans: '2y² + 7y', L: 'y' },
        { q: '(3t − 4) + (−t + 9)', ans: '2t + 5', L: 't' },
        { q: '(6x + 1) − (4x + 5)', ans: '2x − 4', L: 'x', traps: [['2x + 6', 'trapAll']] },
        { q: '(6b + 1) − (4b − 5)', ans: '2b + 6', L: 'b', traps: [['2b - 4', 'trapMissing']] },
        { q: '−(n² − 3n) + 2n²', ans: 'n² + 3n', L: 'n', traps: [['n² - 3n', 'trapGroup'], ['3n² - 3n', 'trapGroup']] },
        { q: '(s + 4) + (2s − 1) + 3s', ans: '6s + 3', L: 's', tri: true },
    ];
    const P4 = [
        { claim: '3a + 2a = 5a²', left: '3a + 2a', wrong: '5a²', ans: '5a', L: 'a' },
        { claim: 'y² + y = y³', left: 'y² + y', wrong: 'y³', wrongVal: v => v * v * v, ans: 'y² + y', L: 'y' },
    ];

    const STR = {
        fr: {
            title: `➕ Additionner et soustraire`,
            concept: `Soit <em>k</em>, le nombre de crayons dans chaque boîte (toutes les boîtes en contiennent autant). Les crayons libres sont comptés un par un. ` +
                `Pour additionner ou soustraire, on ne regroupe que des quantités <strong>de la même sorte</strong> : les boîtes avec les boîtes, les crayons libres avec les crayons libres.`,
            box: `boîte de <em>k</em> crayons`, pencil: `crayon libre`,
            p1Title: `Les boîtes et les crayons`,
            p1Intro: `Voici 3 boîtes et 5 crayons libres, plus 2 boîtes et 1 crayon libre. Regroupe, puis écris le total.`,
            group: `Regrouper`, ungroup: `Séparer de nouveau`,
            boxes: k => `${k} boîte${k > 1 ? 's' : ''}`, pencils: k => `${k} crayon${k > 1 ? 's' : ''} libre${k > 1 ? 's' : ''}`,
            xLabel: `Crayons par boîte : <em>§</em> =`,
            total: (x, v) => `Avec <em>§</em> = ${x}, il y a ${v} crayons en tout.`,
            yourTotal: `Le total :`,
            check: `Vérifier`, reveal: `Voir la réponse`,
            mixed: `Une boîte et un crayon libre ne sont pas de la même sorte : on ne peut pas les additionner en un seul nombre. Compte les boîtes, puis les crayons libres.`,
            countAgain: `Compte de nouveau les boîtes, puis les crayons libres.`,
            regroupMore: `C'est équivalent, mais peux-tu regrouper encore ?`,
            okOrder: `✅ C'est juste ! On écrit habituellement les termes en ordre décroissant de degré.`,
            ok: `✅ Bravo !`,
            times: `Pour multiplier, écris des parenthèses : pas de ×, d'astérisque ni de point.`,
            parse: `Je ne reconnais pas cette écriture.`,
            empty: `Écris ta réponse.`,
            deg: `Ici, on reste au degré 2 ou moins.`,
            answer: a => `Réponse : ${a}`,
            p2Title: `Enlever un groupe`,
            p2Intro: `On enlève tout un groupe. Touche « Enlever » pour voir ce qui reste, puis écris-le.`,
            remove: `Enlever le groupe`,
            missing: `crayons qui manquent au groupe`,
            whatLeft: `Ce qui reste`,
            backNote: `En vert : les 3 crayons qui manquaient au groupe enlevé. Ils ne sont pas partis : ils restent.`,
            p2Trap: (a, b, r, s2) => `Avec <em>§</em> = 10 : 5<em>§</em> + 7 vaut ${a} et 2<em>§</em> ${M} 3 vaut ${b}. Enlève ${b} de ${a} : combien reste-t-il ? Ton expression donne ${s2}.`,
            p2Meaning: `Avec <em>§</em> = 10 : 2<em>§</em> ${M} 3 vaut 17. Enlever 17 de 57 donne 40, soit 3(10) + 10. ` +
                `Enlever « 2<em>§</em> ${M} 3 », c'est enlever 3 de moins que 2<em>§</em> : il en reste donc 3 de plus.`,
            wrongVal: (x, a, b) => `Avec <em>§</em> = ${x}, l'expression de départ vaut ${a}, mais la tienne vaut ${b}.`,
            fbLetter: `Dans ce problème, la lettre utilisée est <em>§</em>. Que représente-t-elle ?`,
            p3Title: `À toi`,
            p3Intro: `Écris chaque expression sous forme réduite.`,
            triCap: `Périmètre du triangle :`,
            trapAll: `On enlève tout le groupe 4<em>§</em> + 5 : le terme 4<em>§</em>, et aussi le 5. Essaie avec <em>§</em> = 10.`,
            trapMissing: `Regarde le signe devant le 5 dans le groupe qu'on enlève. Essaie avec <em>§</em> = 10 : combien vaut 4<em>§</em> ${M} 5 ?`,
            trapGroup: `Le signe moins devant la parenthèse enlève tout le groupe <em>§</em>² ${M} 3<em>§</em>. Essaie avec <em>§</em> = 10.`,
            p4Title: `Trouve l'erreur`,
            p4Intro: `Chaque égalité contient une erreur. Écris le bon résultat, puis confirme l'erreur en remplaçant la lettre par 2.`,
            good: `Le bon résultat :`,
            leftAt2: `Avec <em>§</em> = 2, le côté gauche vaut :`,
            rightAt2: `Avec <em>§</em> = 2, le côté droit vaut :`,
            p4Like: `3<em>§</em> + 2<em>§</em>, c'est 3 fois le nombre <em>§</em>, plus 2 fois ce nombre : combien de fois <em>§</em> en tout ? Le résultat compte des <em>§</em>, pas des <em>§</em>².`,
            p4NotLike: `<em>§</em>² et <em>§</em> ne sont pas de la même sorte : on ne peut pas les regrouper en un seul terme. Que reste-t-il à écrire ?`,
            p4Left: `Remplace <em>§</em> par (2) dans le côté gauche et calcule.`,
            p4Right: `Remplace <em>§</em> par (2) dans le côté droit et calcule.`,
            p4Ok: (l, r) => `✅ Avec <em>§</em> = 2, le côté gauche vaut ${l}, mais le côté droit vaut ${r} : l'égalité est fausse. Une seule valeur suffit pour le montrer.`,
            badNum: `Écris un nombre.`,
        },
        en: {
            title: `➕ Adding and subtracting`,
            concept: `Let <em>k</em> be the number of pencils in each box (every box holds the same number). Loose pencils are counted one by one. ` +
                `To add or subtract, we only group quantities <strong>of the same kind</strong>: boxes with boxes, loose pencils with loose pencils.`,
            box: `box of <em>k</em> pencils`, pencil: `loose pencil`,
            p1Title: `Boxes and pencils`,
            p1Intro: `Here are 3 boxes and 5 loose pencils, plus 2 boxes and 1 loose pencil. Group them, then write the total.`,
            group: `Group`, ungroup: `Separate again`,
            boxes: k => `${k} box${k > 1 ? 'es' : ''}`, pencils: k => `${k} loose pencil${k > 1 ? 's' : ''}`,
            xLabel: `Pencils per box: <em>§</em> =`,
            total: (x, v) => `With <em>§</em> = ${x}, there are ${v} pencils in all.`,
            yourTotal: `The total:`,
            check: `Check`, reveal: `Show the answer`,
            mixed: `A box and a loose pencil are not of the same kind: they cannot be added into a single number. Count the boxes, then the loose pencils.`,
            countAgain: `Count the boxes again, then the loose pencils.`,
            regroupMore: `That is equivalent, but can you group further?`,
            okOrder: `✅ That's right! We usually write the terms in decreasing order of degree.`,
            ok: `✅ Well done!`,
            times: `To multiply, write parentheses: no ×, asterisk or dot.`,
            parse: `I don't recognize this.`,
            empty: `Write your answer.`,
            deg: `Here we stay at degree 2 or less.`,
            answer: a => `Answer: ${a}`,
            p2Title: `Taking a group away`,
            p2Intro: `We take a whole group away. Tap “Take away” to see what is left, then write it.`,
            remove: `Take the group away`,
            missing: `pencils missing from the group`,
            whatLeft: `What is left`,
            backNote: `In green: the 3 pencils that were missing from the group taken away. They did not leave: they stay.`,
            p2Trap: (a, b, r, s2) => `With <em>§</em> = 10: 5<em>§</em> + 7 is ${a} and 2<em>§</em> ${M} 3 is ${b}. Take ${b} from ${a}: how many are left? Your expression gives ${s2}.`,
            p2Meaning: `With <em>§</em> = 10: 2<em>§</em> ${M} 3 is 17. Taking 17 from 57 gives 40, which is 3(10) + 10. ` +
                `Taking away “2<em>§</em> ${M} 3” means taking away 3 less than 2<em>§</em>: so 3 more are left.`,
            wrongVal: (x, a, b) => `With <em>§</em> = ${x}, the starting expression is ${a}, but yours is ${b}.`,
            fbLetter: `In this problem, the letter used is <em>§</em>. What does it stand for?`,
            p3Title: `Your turn`,
            p3Intro: `Write each expression in simplified form.`,
            triCap: `Perimeter of the triangle:`,
            trapAll: `We take away the whole group 4<em>§</em> + 5: the term 4<em>§</em>, and also the 5. Try with <em>§</em> = 10.`,
            trapMissing: `Look at the sign in front of the 5 in the group being taken away. Try with <em>§</em> = 10: what is 4<em>§</em> ${M} 5?`,
            trapGroup: `The minus sign in front of the parentheses takes away the whole group <em>§</em>² ${M} 3<em>§</em>. Try with <em>§</em> = 10.`,
            p4Title: `Find the mistake`,
            p4Intro: `Each equality contains a mistake. Write the right result, then confirm the mistake by replacing the letter with 2.`,
            good: `The right result:`,
            leftAt2: `With <em>§</em> = 2, the left side is:`,
            rightAt2: `With <em>§</em> = 2, the right side is:`,
            p4Like: `3<em>§</em> + 2<em>§</em> is 3 times the number <em>§</em>, plus 2 times that number: how many times <em>§</em> in all? The result counts <em>§</em>, not <em>§</em>².`,
            p4NotLike: `<em>§</em>² and <em>§</em> are not of the same kind: they cannot be grouped into one term. What is left to write?`,
            p4Left: `Replace <em>§</em> with (2) on the left side and calculate.`,
            p4Right: `Replace <em>§</em> with (2) on the right side and calculate.`,
            p4Ok: (l, r) => `✅ With <em>§</em> = 2, the left side is ${l}, but the right side is ${r}: the equality is false. One value is enough to show it.`,
            badNum: `Write a number.`,
        },
    };

    const state = {
        lang: Langue.lang,
        p1: { grouped: false, x: 4, ans: '', fb: null, ok: false },
        p2: [{ removed: false, ans: '', fb: null, ok: false }, { removed: false, ans: '', fb: null, ok: false }],
        p3: P3.map(() => ({ ans: '', fb: null, ok: false })),
        p4: P4.map(() => ({ good: '', l: '', r: '', fb: null, ok: false })),
    };
    const $ = id => document.getElementById(id);
    const s = () => STR[state.lang];
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const num = v => Expr.fmtNum(v, state.lang);
    const fbHtml = f => f ? `<div class="feedback ${f.cls}">${f.html}</div>` : '';
    const pretty = t => t.replace(/([a-z])/g, '<em>$1</em>').replace(/-/g, M);
    // Value of an expression for a value of its letter
    const val = (txt, v) => { const r = Expr.parse(txt); return Expr.value(r.ast, { [r.letters[0]]: v }); };
    function readNum(str) {
        const t = String(str).replace(/\s+/g, '').replace(/[−–—]/g, '-').replace(',', '.');
        return /^-?\d+(\.\d+)?$/.test(t) ? Number(t) : NaN;
    }

    // ── Dessin : boîtes et crayons ──
    // items: [{ kind: 'box' | 'pencil', look: 'normal' | 'removed' | 'missing' }]
    function itemsSvg(items, perRow = 8) {
        const W = 34, H = 40, G = 6;
        const rows = Math.ceil(items.length / perRow) || 1;
        const cols = Math.min(perRow, items.length) || 1;
        let g = '';
        items.forEach((it, i) => {
            const x = (i % perRow) * (W + G), y = Math.floor(i / perRow) * (H + G);
            const dim = it.look === 'removed' || it.look === 'missing';
            if (it.kind === 'box') {
                g += `<rect x="${x + 2}" y="${y + 6}" width="${W - 4}" height="${H - 10}" rx="4" fill="${dim ? 'white' : '#1f5fa8'}" stroke="#1f5fa8" stroke-width="2" ${dim ? 'stroke-dasharray="4 3"' : ''}/>`;
                g += `<text x="${x + W / 2}" y="${y + H / 2 + 6}" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="16" fill="${dim ? '#1f5fa8' : 'white'}">k</text>`;
            } else {
                const col = it.look === 'missing' ? 'none' : it.look === 'back' ? '#2e7d4f' : (dim ? 'white' : '#c84a16');
                g += `<rect x="${x + W / 2 - 4}" y="${y + 6}" width="8" height="${H - 16}" rx="2" fill="${col}" stroke="#c84a16" stroke-width="2" ${dim ? 'stroke-dasharray="3 2"' : ''}/>`;
                g += `<polygon points="${x + W / 2 - 4},${y + H - 10} ${x + W / 2 + 4},${y + H - 10} ${x + W / 2},${y + H - 3}" fill="${dim ? 'white' : '#f2c9a8'}" stroke="#c84a16" stroke-width="1.5"/>`;
            }
            if (it.look === 'removed') g += `<line x1="${x}" y1="${y + 4}" x2="${x + W}" y2="${y + H - 2}" stroke="#1f2d4d" stroke-width="2.5"/>`;
        });
        const w = cols * (W + G) - G, h = rows * (H + G) - G;
        return `<svg class="items" viewBox="-2 -2 ${w + 4} ${h + 4}" width="${w + 4}" aria-hidden="true">${g}</svg>`;
    }
    const many = (kind, k, look = 'normal') => Array.from({ length: k }, () => ({ kind, look }));
    function legend() {
        const t = s();
        return `<div class="legend"><span>${itemsSvg([{ kind: 'box', look: 'normal' }]).replace('class="items"', 'class="items" style="display:inline;vertical-align:middle;width:22px"')} ${t.box}</span>` +
            `<span>${itemsSvg([{ kind: 'pencil', look: 'normal' }]).replace('class="items"', 'class="items" style="display:inline;vertical-align:middle;width:22px"')} ${t.pencil}</span></div>`;
    }

    // Check an answer that must be simplified, equivalent to `start`
    function judge(raw, start, traps = [], L = 'x') {
        const t = s();
        const r = Expr.parse(raw);
        if (r.err === 'empty') return { cls: 'hint', html: t.empty };
        if (r.err === 'times') return { cls: 'hint', html: t.times };
        if (r.err === 'deg') return { cls: 'hint', html: t.deg };
        if (r.err) return { cls: 'hint', html: t.parse };
        // Another letter than the problem's: a hint, not an error
        if (r.letters.some(x => x !== L)) return { cls: 'hint', html: t.fbLetter };
        const S = Expr.parse(start);
        if (!Expr.equivalent(r, S)) {
            const trap = traps.find(([tr]) => Expr.equivalent(r, Expr.parse(tr)));
            if (trap) return { cls: 'hint', html: t[trap[1]] };
            const v = [2, 3, 5].find(w => Math.abs(Expr.value(r.ast, { [L]: w }) - Expr.value(S.ast, { [L]: w })) > 1e-9);
            return { cls: 'hint', html: t.wrongVal(v, num(Expr.value(S.ast, { [L]: v })), num(Expr.value(r.ast, { [L]: v }))), kind: 'value' };
        }
        if (!Expr.isReduced(r.ast)) return { cls: 'hint', html: t.regroupMore };
        return { cls: 'ok', html: Expr.isOrdered(r.ast) ? t.ok : t.okOrder, ok: true };
    }

    function renderP1() {
        const t = s(), st = state.p1, x = st.x;
        let h = `<p class="intro">${t.p1Intro}</p>${legend()}`;
        if (!st.grouped) {
            h += `<div class="groups"><div class="group">${itemsSvg([...many('box', 3), ...many('pencil', 5)], 4)}<div class="cap">${t.boxes(3)}, ${t.pencils(5)}</div></div>` +
                `<div class="op">+</div><div class="group">${itemsSvg([...many('box', 2), ...many('pencil', 1)], 4)}<div class="cap">${t.boxes(2)}, ${t.pencils(1)}</div></div></div>`;
        } else {
            h += `<div class="groups"><div class="group">${itemsSvg(many('box', 5), 5)}<div class="cap">${t.boxes(5)}</div></div>` +
                `<div class="op">+</div><div class="group">${itemsSvg(many('pencil', 6), 6)}<div class="cap">${t.pencils(6)}</div></div></div>`;
        }
        h += `<div class="center"><button type="button" class="btn light" id="groupBtn">${st.grouped ? t.ungroup : t.group}</button></div>`;
        h += `<div class="n-row"><label for="xRange">${t.xLabel}</label><input type="range" id="xRange" min="1" max="12" value="${x}"><strong>${x}</strong></div>` +
            `<p class="center">${t.total(x, 5 * x + 6)}</p>`;
        h += `<div class="row"><label for="p1ans">${t.yourTotal}</label><input class="text-input${st.ok ? ' ok-field' : ''}" id="p1ans" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.ans)}">` +
            `<button type="button" class="btn" id="p1Check">${t.check}</button><button type="button" class="btn light" id="p1Reveal">${t.reveal}</button></div>${fbHtml(st.fb)}`;
        $('p1').innerHTML = h.replace(/§/g, 'k');
    }

    const P2 = [
        { start: '(5k + 7) - (2k + 3)', label: '(5<em>k</em> + 7) − (2<em>k</em> + 3)', sub: { box: 2, pencil: 3, sign: 1 }, ans: '3k + 4' },
        { start: '(5k + 7) - (2k - 3)', label: '(5<em>k</em> + 7) − (2<em>k</em> − 3)', sub: { box: 2, pencil: 3, sign: -1 }, ans: '3k + 10' },
    ];
    function renderP2() {
        const t = s();
        let h = `<p class="intro">${t.p2Intro}</p>`;
        P2.forEach((it, i) => {
            const st = state.p2[i];
            const whole = [...many('box', 5), ...many('pencil', 7)];
            let left;
            if (!st.removed) left = whole;
            else if (it.sub.sign > 0) left = [...many('box', 3), ...many('box', 2, 'removed'), ...many('pencil', 4), ...many('pencil', 3, 'removed')];
            else left = [...many('box', 3), ...many('box', 2, 'removed'), ...many('pencil', 7), ...many('pencil', 3, 'back')];
            // The group taken away: 2 boxes, with 3 pencils added (+3) or missing (−3)
            const taken = [...many('box', 2), ...many('pencil', 3, it.sub.sign > 0 ? 'normal' : 'missing')];
            h += `<div class="card${st.ok ? ' done' : ''}"><div class="big">${it.label}</div>` +
                `<div class="groups"><div class="group">${itemsSvg(left, 6)}<div class="cap">${st.removed ? t.whatLeft : '5<em>k</em> + 7'}</div></div><div class="op">${M}</div>` +
                `<div class="group minus">${itemsSvg(taken, 5)}<div class="cap">${it.sub.sign > 0 ? '2<em>k</em> + 3' : `2<em>k</em> ${M} 3 <span class="note">(${t.missing})</span>`}</div></div></div>` +
                `<div class="center"><button type="button" class="btn light" data-remove="${i}"${st.removed ? ' disabled' : ''}>${t.remove}</button></div>` +
                `<div class="row"><input class="text-input${st.ok ? ' ok-field' : ''}" id="p2ans${i}" data-p2="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${it.label.replace(/<[^>]+>/g, '')}" value="${esc(st.ans)}">` +
                `<button type="button" class="btn" data-p2check="${i}">${t.check}</button><button type="button" class="btn light" data-p2reveal="${i}">${t.reveal}</button></div>${fbHtml(st.fb)}` +
                (i === 1 && st.removed ? `<p class="center note">${t.backNote}</p>` : '') +
                (i === 1 && st.ok ? `<div class="feedback info">${t.p2Meaning}</div>` : '') + `</div>`;
        });
        $('p2').innerHTML = h.replace(/§/g, 'k');
    }
    function checkP2(i) {
        const t = s(), it = P2[i], st = state.p2[i];
        const r = Expr.parse(st.ans);
        if (i === 1 && !r.err && Expr.equivalent(r, Expr.parse('3k + 4'))) {
            st.fb = { cls: 'hint', html: t.p2Trap(57, 17, 40, num(Expr.value(r.ast, { k: 10 }))) };
            st.ok = false;
        } else {
            const f = judge(st.ans, it.start, [], 'k');
            st.ok = !!f.ok; st.fb = f;
        }
        rerender(renderP2);
    }

    function triSvg() {
        return `<svg class="tri" viewBox="0 0 280 190" aria-hidden="true">` +
            `<polygon points="30,165 250,165 110,25" fill="#eef3fa" stroke="#1f5fa8" stroke-width="3"/>` +
            `<text x="140" y="186" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2d4d">3<tspan font-family="Georgia, serif" font-style="italic">s</tspan></text>` +
            `<text x="48" y="92" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2d4d"><tspan font-family="Georgia, serif" font-style="italic">s</tspan> + 4</text>` +
            `<text x="214" y="88" text-anchor="middle" font-size="16" font-weight="800" fill="#1f2d4d">2<tspan font-family="Georgia, serif" font-style="italic">s</tspan> ${M} 1</text></svg>`;
    }
    function renderP3() {
        const t = s();
        let h = `<p class="intro">${t.p3Intro}</p>`;
        P3.forEach((it, i) => {
            const st = state.p3[i];
            h += (`<div class="card${st.ok ? ' done' : ''}">` + (it.tri ? `${triSvg()}<div class="big">${t.triCap}</div>` : `<div class="big">${pretty(it.q)}</div>`) +
                `<div class="row"><input class="text-input${st.ok ? ' ok-field' : ''}" id="p3ans${i}" data-p3="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="${it.tri ? t.triCap : it.q}" value="${esc(st.ans)}">` +
                `<button type="button" class="btn light small" data-sq="${i}" aria-label="${it.L}²">${it.L}²</button>` +
                `<button type="button" class="btn" data-p3check="${i}">${t.check}</button><button type="button" class="btn light" data-p3reveal="${i}">${t.reveal}</button></div>${fbHtml(st.fb)}</div>`).replace(/§/g, it.L);
        });
        $('p3').innerHTML = h;
    }

    function renderP4() {
        const t = s();
        let h = `<p class="intro">${t.p4Intro}</p>`;
        P4.forEach((it, i) => {
            const st = state.p4[i];
            h += (`<div class="card${st.ok ? ' done' : ''}"><div class="big">« ${pretty(it.claim)} »</div>` +
                `<div class="row"><label for="g${i}">${t.good}</label><input class="text-input" id="g${i}" data-g="${i}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(st.good)}"></div>` +
                `<div class="row"><label for="l${i}">${t.leftAt2}</label><input class="num-input" id="l${i}" data-l="${i}" type="text" inputmode="decimal" autocomplete="off" value="${esc(st.l)}"></div>` +
                `<div class="row"><label for="r${i}">${t.rightAt2}</label><input class="num-input" id="r${i}" data-r="${i}" type="text" inputmode="decimal" autocomplete="off" value="${esc(st.r)}"></div>` +
                `<div class="row"><button type="button" class="btn" data-p4check="${i}">${t.check}</button><button type="button" class="btn light" data-p4reveal="${i}">${t.reveal}</button></div>${fbHtml(st.fb)}</div>`).replace(/§/g, it.L);
        });
        $('p4').innerHTML = h;
    }
    function checkP4(i) {
        const t = s(), it = P4[i], st = state.p4[i];
        const g = Expr.parse(st.good);
        const leftV = val(it.left, 2), rightV = it.wrongVal ? it.wrongVal(2) : val(it.wrong, 2);
        st.ok = false;
        if (g.err === 'empty') st.fb = { cls: 'hint', html: t.empty };
        else if (g.err === 'times') st.fb = { cls: 'hint', html: t.times };
        else if (g.err) st.fb = { cls: 'hint', html: i === 1 ? t.p4NotLike : t.parse };
        else if (g.letters.some(x => x !== it.L)) st.fb = { cls: 'hint', html: t.fbLetter };
        else if (!Expr.equivalent(g, Expr.parse(it.left)) || !Expr.isReduced(g.ast)) st.fb = { cls: 'hint', html: i === 0 ? t.p4Like : t.p4NotLike };
        else if (readNum(st.l) !== leftV) st.fb = { cls: 'hint', html: isNaN(readNum(st.l)) ? t.badNum : t.p4Left };
        else if (readNum(st.r) !== rightV) st.fb = { cls: 'hint', html: isNaN(readNum(st.r)) ? t.badNum : t.p4Right };
        else { st.ok = true; st.fb = { cls: 'ok', html: t.p4Ok(leftV, rightV) }; }
        rerender(renderP4);
    }

    function rerender(fn) {
        const a = document.activeElement, keep = a && a.id;
        fn();
        const el = keep && $(keep);
        if (el) el.focus();
    }

    document.addEventListener('input', e => {
        const el = e.target;
        if (el.id === 'xRange') { state.p1.x = Number(el.value); renderP1(); $('xRange').focus(); }
        else if (el.id === 'p1ans') state.p1.ans = el.value;
        else if (el.dataset.p2) state.p2[el.dataset.p2].ans = el.value;
        else if (el.dataset.p3) state.p3[el.dataset.p3].ans = el.value;
        else if (el.dataset.g) state.p4[el.dataset.g].good = el.value;
        else if (el.dataset.l) state.p4[el.dataset.l].l = el.value;
        else if (el.dataset.r) state.p4[el.dataset.r].r = el.value;
    });
    document.addEventListener('click', e => {
        const el = e.target, t = s();
        if (el.closest('#groupBtn')) { state.p1.grouped = !state.p1.grouped; renderP1(); $('groupBtn').focus(); return; }
        if (el.closest('#p1Check')) {
            const r = Expr.parse(state.p1.ans);
            const mixed = !r.err && (Expr.equivalent(r, Expr.parse('11k')) || Expr.equivalent(r, Expr.parse('11')));
            const f = mixed ? { cls: 'hint', html: t.mixed } : judge(state.p1.ans, '(3k + 5) + (2k + 1)', [], 'k');
            if (f.kind === 'value') f.html = t.countAgain;
            state.p1.fb = f; state.p1.ok = !!f.ok;
            return rerender(renderP1);
        }
        if (el.closest('#p1Reveal')) { state.p1.fb = { cls: 'info', html: t.answer(pretty('5k + 6')) }; return rerender(renderP1); }
        const rm = el.closest('[data-remove]');
        if (rm) { state.p2[rm.dataset.remove].removed = true; return rerender(renderP2); }
        const c2 = el.closest('[data-p2check]');
        if (c2) return checkP2(Number(c2.dataset.p2check));
        const r2 = el.closest('[data-p2reveal]');
        if (r2) { state.p2[r2.dataset.p2reveal].fb = { cls: 'info', html: t.answer(pretty(P2[r2.dataset.p2reveal].ans)) }; return rerender(renderP2); }
        const c3 = el.closest('[data-p3check]');
        if (c3) {
            const i = Number(c3.dataset.p3check), it = P3[i], st = state.p3[i];
            const f = judge(st.ans, it.q.replace(/−/g, '-'), it.traps || [], it.L);
            st.fb = f; st.ok = !!f.ok;
            return rerender(renderP3);
        }
        const r3 = el.closest('[data-p3reveal]');
        if (r3) { state.p3[r3.dataset.p3reveal].fb = { cls: 'info', html: t.answer(pretty(P3[r3.dataset.p3reveal].ans)) }; return rerender(renderP3); }
        const sq = el.closest('[data-sq]');
        if (sq) {
            const inp = $('p3ans' + sq.dataset.sq);
            const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? inp.value.length;
            const sqL = P3[sq.dataset.sq].L;
            inp.value = inp.value.slice(0, a) + sqL + '²' + inp.value.slice(b);
            state.p3[sq.dataset.sq].ans = inp.value;
            inp.focus(); inp.setSelectionRange(a + 2, a + 2);
            return;
        }
        const c4 = el.closest('[data-p4check]');
        if (c4) return checkP4(Number(c4.dataset.p4check));
        const r4 = el.closest('[data-p4reveal]');
        if (r4) {
            const it = P4[r4.dataset.p4reveal];
            state.p4[r4.dataset.p4reveal].fb = { cls: 'info', html: t.answer(`${pretty(it.ans)} ; ${val(it.left, 2)} ≠ ${it.wrongVal ? it.wrongVal(2) : val(it.wrong, 2)}`) };
            return rerender(renderP4);
        }
    });
    document.addEventListener('keydown', e => {
        if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
        const el = e.target;
        if (el.id === 'p1ans') $('p1Check').click();
        else if (el.dataset.p2) checkP2(Number(el.dataset.p2));
        else if (el.dataset.p3) document.querySelector(`[data-p3check="${el.dataset.p3}"]`).click();
        else if (el.dataset.g || el.dataset.l || el.dataset.r) checkP4(Number(el.dataset.g || el.dataset.l || el.dataset.r));
    });

    function applyLang() {
        const t = s();
        document.querySelectorAll('[data-i18n]').forEach(el => { const v = t[el.dataset.i18n]; if (typeof v === 'string') el.innerHTML = v; });
        document.title = t.title.replace(/^\S+\s/, '') + ' – LaboMath';
        $('concept').innerHTML = t.concept;
        state.p1.fb = null;
        state.p2.forEach(x => { x.fb = null; }); state.p3.forEach(x => { x.fb = null; }); state.p4.forEach(x => { x.fb = null; });
        renderP1(); renderP2(); renderP3(); renderP4();
    }
    Langue.onChange(lang => { state.lang = lang; applyLang(); });
    applyLang();
</script>

</body>
</html>
