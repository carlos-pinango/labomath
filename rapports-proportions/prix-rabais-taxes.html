<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prix, rabais et taxes – LaboMath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../commun/style.css">
    <script src="../commun/langue.js"></script>
    <style>
        /* Styles propres à cette activité (le reste vient de commun/style.css) */
        :root {
            --c-pre:   #5DADE2;   /* prix avant taxes */
            --c-tps:   #58D68D;
            --c-tvq:   #AF7AC5;
            --c-rabais: #E67E22;
        }

        .container {
            color: #2c3e50;
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        h1 {
            color: #e67e22;
            font-weight: 900;
            line-height: 1.2;
            border-bottom: 2px solid #fcf3cf;
            padding-bottom: 10px;
        }

        .concept-box {
            background: #fdf2e9;
            padding: 15px;
            border-left: 5px solid #e67e22;
            margin: 20px 0;
            border-radius: 4px;
            font-size: 0.95em;
            line-height: 1.6;
        }

        /* ── Réglages ── */
        .panel {
            background: #fdf2e9;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 18px;
            font-weight: 700;
        }

        .field { display: flex; align-items: center; gap: 6px; }

        .num-input {
            width: 84px;
            padding: 6px 8px;
            border: 2px solid #f0a868;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            font-weight: 800;
            color: #e67e22;
            text-align: center;
            outline: none;
            background: white;
            transition: border-color 0.2s;
        }
        .num-input:focus { border-color: #e67e22; }
        .num-input.invalid { border-color: #e74c3c; color: #e74c3c; }
        .unit { font-weight: 800; color: #e67e22; }

        .small-btn {
            border: none;
            background: white;
            color: #e67e22;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.85em;
            border-radius: 20px;
            padding: 5px 12px;
            cursor: pointer;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .small-btn:hover { background: #fcf3cf; }

        /* Boutons à deux choix */
        .toggle {
            display: inline-flex;
            background: white;
            border-radius: 20px;
            padding: 3px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .toggle button {
            border: none;
            background: transparent;
            color: #7f8c8d;
            font-family: inherit;
            font-weight: 800;
            font-size: 0.85em;
            border-radius: 18px;
            padding: 5px 12px;
            cursor: pointer;
        }
        .toggle button.active { background: #e67e22; color: white; }

        /* ── Colonnes ── */
        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 16px;
            margin: 24px 0 8px;
        }
        .col-title {
            text-align: center;
            font-size: 0.75em;
            font-weight: 800;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }
        .col-area {
            position: relative;
            height: 340px;
            display: flex;
            align-items: flex-end;
        }
        /* Columns side by side in the middle; labels of thin parts go on the outer side */
        #areaA { justify-content: flex-end; }
        #areaB { justify-content: flex-start; }
        .stack {
            position: relative;
            height: 100%;
            width: 60%;
            min-width: 70px;
        }
        .seg {
            position: absolute;
            left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 0.75em;
            font-weight: 800;
            color: white;
            line-height: 1.15;
            transition: bottom 0.25s ease, height 0.25s ease;
        }
        /* Part too thin for its label: show it beside the column */
        .seg.tiny span {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            white-space: nowrap;
            color: #2c3e50;
            font-size: 0.95em;
        }
        .seg.tiny span br { display: none; }
        .seg.tiny span::before { content: '◂ '; color: #95a5a6; }
        #stackA .seg.tiny span { right: calc(100% + 8px); }
        #stackA .seg.tiny span::before { content: ''; }
        #stackA .seg.tiny span::after { content: ' ▸'; color: #95a5a6; }
        #stackB .seg.tiny span { left: calc(100% + 8px); }
        .seg.pre { background: var(--c-pre); border-radius: 0 0 8px 8px; }
        .seg.tps { background: var(--c-tps); }
        .seg.tvq { background: var(--c-tvq); }
        .seg.rab {
            background: repeating-linear-gradient(45deg, #fdebd0 0 6px, #f8c471 6px 12px);
            border: 2px dashed var(--c-rabais);
            border-bottom: none;
            color: #a04000;
        }
        .seg.top { border-radius: 8px 8px 0 0; }
        /* Contour du prix final */
        .final-box {
            position: absolute;
            left: -3px; right: -3px; bottom: -3px;
            border: 3px solid #2c3e50;
            border-radius: 0 0 10px 10px;
            pointer-events: none;
        }
        #colA .col-title, #colA .col-total { text-align: right; }
        #colB .col-title, #colB .col-total { text-align: left; }
        .col-total {
            text-align: center;
            margin-top: 10px;
            font-weight: 800;
        }
        .col-total strong { color: #e67e22; font-size: 1.15em; }

        /* ── Tableau ── */
        .table-wrap { overflow-x: auto; margin: 18px 0 12px; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92em;
        }
        th, td {
            padding: 7px 8px;
            text-align: right;
            border-bottom: 1px solid #f0f0f0;
            white-space: nowrap;
        }
        th { font-size: 0.8em; color: #95a5a6; text-transform: uppercase; letter-spacing: 0.5px; }
        th:first-child, td:first-child { text-align: left; }
        td.pct { color: #e67e22; font-weight: 800; }
        tr.total td { font-weight: 900; border-top: 2px solid #2c3e50; }
        .swatch {
            display: inline-block;
            width: 12px; height: 12px;
            border-radius: 3px;
            margin-right: 6px;
            vertical-align: -1px;
        }
        .swatch.pre { background: var(--c-pre); }
        .swatch.tps { background: var(--c-tps); }
        .swatch.tvq { background: var(--c-tvq); }
        .swatch.rab { background: repeating-linear-gradient(45deg, #fdebd0 0 3px, #f8c471 3px 6px); border: 1px dashed var(--c-rabais); }
        .swatch.aff, .swatch.fin { background: white; border: 2px solid #2c3e50; }
        td.given { color: #e67e22; font-weight: 900; }

        td .num-input { width: 96px; padding: 4px 6px; font-size: 0.95em; }
        .num-input.ok  { border-color: #27ae60; color: #1e8449; background: #e9f7ef; }
        .num-input.bad { border-color: #e74c3c; color: #c0392b; background: #fdedec; }
        .mark { display: inline-block; width: 1.2em; text-align: center; font-weight: 900; }

        .insight, .feedback, .method {
            border-radius: 10px;
            padding: 12px 16px;
            line-height: 1.6;
            margin-top: 10px;
            text-align: center;
        }
        .insight { background: #f8f9fa; color: #5d6d7e; }
        .method { background: #fef9e7; color: #7d6608; text-align: left; }
        .feedback.good { background: #e9f7ef; color: #1e8449; }
        .feedback.bad { background: #fdedec; color: #c0392b; }

        .calc-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 6px;
        }
        .calc-actions .small-btn { background: #fdf2e9; }
        .calc-actions .primary { background: #e67e22; color: white; }
        .calc-actions .primary:hover { background: #d35400; }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .container { padding: 20px 14px; }
            h1 { font-size: 1.4em; }
            .columns { gap: 0 10px; }
            .col-area { height: 260px; }
            .stack { min-width: 54px; }
            .seg.tiny span { font-size: 0.85em; }
            .panel { padding: 12px; }
        }
    </style>
</head>
<body>

<header class="app-header">
    <div class="header-inner">
        <a class="back-btn" href="index.html">← <span data-en="Ratios and proportions">Rapports et proportions</span></a>
        <a class="logo" href="../index.html">
            <div class="logo-icon">∑</div>
            <span class="logo-text">Labo<span class="logo-accent">Math</span></span>
        </a>
        <button class="lang-btn" id="langBtn">EN</button>
    </div>
</header>

<main class="page">
<div class="container">
    <h1 data-i18n="title">🏷️ Prix, rabais et taxes</h1>

    <div class="concept-box" id="concept"></div>

    <!-- Réglages communs aux deux produits -->
    <div class="panel">
        <label class="field"><span data-i18n="rabais">Rabais</span>
            <input type="text" inputmode="decimal" class="num-input" id="inRabais"><span class="unit">%</span></label>
        <label class="field"><span>TPS</span>
            <input type="text" inputmode="decimal" class="num-input" id="inTps"><span class="unit">%</span></label>
        <label class="field"><span>TVQ</span>
            <input type="text" inputmode="decimal" class="num-input" id="inTvq"><span class="unit">%</span></label>
        <div class="field">
            <button class="small-btn" id="quebecBtn" data-i18n="quebec">Taxes réelles du Québec</button>
            <button class="small-btn" id="noTaxesBtn" data-i18n="noTaxes">Taxes à 0</button>
        </div>
    </div>

    <!-- Produit B -->
    <div class="panel">
        <span data-i18n="productB">Produit B :</span>
        <div class="toggle" id="bModeToggle">
            <button data-mode="aff" data-i18n="givenAff">Prix affiché</button>
            <button data-mode="fin" data-i18n="givenFin">Prix final</button>
        </div>
        <label class="field">
            <input type="text" inputmode="decimal" class="num-input" id="inB"><span class="unit">$</span></label>
    </div>

    <!-- Observer ou calculer -->
    <div class="panel">
        <div class="toggle" id="modeToggle">
            <button data-mode="observe" data-i18n="observe">👀 Observer</button>
            <button data-mode="calc" data-i18n="calculate">✏️ Calculer</button>
        </div>
    </div>

    <!-- Deux colonnes de même hauteur = prix final -->
    <div class="columns">
        <div id="colA">
            <div class="col-title" data-i18n="productA">Produit A</div>
            <div class="col-area" id="areaA"><div class="stack" id="stackA"></div></div>
            <div class="col-total" id="totalA"></div>
        </div>
        <div id="colB">
            <div class="col-title" data-i18n="productBTitle">Produit B</div>
            <div class="col-area" id="areaB"><div class="stack" id="stackB"></div></div>
            <div class="col-total" id="totalB"></div>
        </div>
    </div>

    <div class="table-wrap"><table id="table"></table></div>

    <div id="calcZone"></div>

    <div class="insight" id="insight"></div>
</div>
</main>

<footer class="app-footer">
    <span data-en="Designed by Carlos Pinango, engineer and high school math teacher">Conçu par Carlos Pinango, ingénieur et enseignant de mathématiques au secondaire</span>
</footer>

<script>
    const DEFAULT_TAXES = { tps: 5, tvq: 10 };     // round numbers to start with
    const QUEBEC_TAXES = { tps: 5, tvq: 9.975 };   // real rates
    const MAX_RABAIS = 80;
    const TOL = 0.015; // a typed answer may differ from the exact amount by 1 cent

    const STR = {
        fr: {
            title: '🏷️ Prix, rabais et taxes',
            refName: { fin: 'prix final', aff: 'prix affiché' },
            concept: ref => 'Chaque colonne représente un produit, et les deux colonnes ont la <strong>même hauteur</strong>. ' +
                     `Le produit A sert de référence : son <strong>${ref}</strong> est de <strong>100 $</strong>, ` +
                     `donc chaque montant en dollars est aussi un <strong>pourcentage du ${ref}</strong>. ` +
                     'Le rabais, la TPS et la TVQ sont les mêmes pour les deux produits : les parts arrivent à la même hauteur dans les deux colonnes. ' +
                     'Ce sont des <strong>proportions équivalentes</strong> !',
            rabais: 'Rabais',
            quebec: 'Taxes réelles du Québec',
            noTaxes: 'Taxes à 0',
            productB: 'Comparer selon le :',
            givenFin: 'Prix final',
            givenAff: 'Prix affiché',
            observe: '👀 Observer',
            calculate: '✏️ Calculer',
            productA: 'Produit A',
            productBTitle: 'Produit B',
            total: (label, v) => `${label} : <strong>${v}</strong>`,
            rows: {
                aff: 'Prix affiché',
                rab: r => `Rabais (${r} %)`,
                pre: 'Prix avant taxes',
                tps: r => `TPS (${r} %)`,
                tvq: r => `TVQ (${r} %)`,
                fin: 'Prix final',
            },
            seg: { rab: 'Rabais', pre: 'Avant taxes', tps: 'TPS', tvq: 'TVQ' },
            colItem: '',
            colShare: ref => `Part du ${ref}`,
            insight: (rate, share, ref) => `Les taxes (TPS + TVQ) font <strong>${rate} %</strong> du prix avant taxes, ` +
                                      `mais <strong>${share} %</strong> du ${ref} : tout dépend de ce qu'on prend comme « tout ».`,
            insightNone: 'Sans taxes, le prix final est égal au prix avant taxes.',
            insightSame: (rate, ref) => `Les taxes (TPS + TVQ) font <strong>${rate} %</strong> du prix avant taxes. ` +
                                      `Sans rabais, le ${ref} est le prix avant taxes : c'est le même pourcentage. Ajoute un rabais pour voir la différence !`,
            check: 'Vérifier',
            reveal: 'Montrer les réponses',
            hide: 'Cacher les réponses',
            methodShow: '💡 Méthode',
            methodHide: '💡 Cacher la méthode',
            method: (ref, pct, refB, ex) =>
                `Le produit A sert de référence : chaque montant de A est un <strong>pourcentage du ${ref}</strong>. ` +
                `Pour B, multiplie ce pourcentage par le ${ref} de B.<br>` +
                `Exemple : TVQ de B = ${pct} % × ${refB} ≈ <strong>${ex}</strong>.`,
            allGood: '✅ Bravo ! Tous les montants sont bons.',
            someBad: (n, m) => `${n} sur ${m} sont bons. Corrige les cases en rouge (une différence de 1 ¢ est acceptée).`,
            empty: 'Remplis les cases de la colonne B, puis clique sur « Vérifier ».',
            rounding: 'Les montants sont arrondis au cent près : leur somme peut différer de 0,01 $.',
        },
        en: {
            title: '🏷️ Price, discount and taxes',
            refName: { fin: 'final price', aff: 'listed price' },
            concept: ref => 'Each column is a product, and both columns have the <strong>same height</strong>. ' +
                     `Product A is the reference: its <strong>${ref}</strong> is <strong>$100</strong>, ` +
                     `so every dollar amount is also a <strong>percentage of the ${ref}</strong>. ` +
                     'The discount, GST and QST are the same for both products: the parts reach the same height in both columns. ' +
                     'These are <strong>equivalent proportions</strong>!',
            rabais: 'Discount',
            quebec: 'Real Quebec taxes',
            noTaxes: 'Taxes at 0',
            productB: 'Compare by:',
            givenFin: 'Final price',
            givenAff: 'Listed price',
            observe: '👀 Observe',
            calculate: '✏️ Calculate',
            productA: 'Product A',
            productBTitle: 'Product B',
            total: (label, v) => `${label}: <strong>${v}</strong>`,
            rows: {
                aff: 'Listed price',
                rab: r => `Discount (${r}%)`,
                pre: 'Price before taxes',
                tps: r => `GST (${r}%)`,
                tvq: r => `QST (${r}%)`,
                fin: 'Final price',
            },
            seg: { rab: 'Discount', pre: 'Before taxes', tps: 'GST', tvq: 'QST' },
            colItem: '',
            colShare: ref => `Share of ${ref}`,
            insight: (rate, share, ref) => `Taxes (GST + QST) are <strong>${rate}%</strong> of the price before taxes, ` +
                                      `but <strong>${share}%</strong> of the ${ref}: it all depends on what you take as the "whole".`,
            insightNone: 'With no taxes, the final price equals the price before taxes.',
            insightSame: (rate, ref) => `Taxes (GST + QST) are <strong>${rate}%</strong> of the price before taxes. ` +
                                      `With no discount, the ${ref} is the price before taxes: same percentage. Add a discount to see the difference!`,
            check: 'Check',
            reveal: 'Show answers',
            hide: 'Hide answers',
            methodShow: '💡 Method',
            methodHide: '💡 Hide method',
            method: (ref, pct, refB, ex) =>
                `Product A is the reference: each amount in A is a <strong>percentage of the ${ref}</strong>. ` +
                `For B, multiply that percentage by B's ${ref}.<br>` +
                `Example: B's QST = ${pct}% × ${refB} ≈ <strong>${ex}</strong>.`,
            allGood: '✅ Well done! All amounts are correct.',
            someBad: (n, m) => `${n} out of ${m} are correct. Fix the boxes in red (a 1¢ difference is accepted).`,
            empty: 'Fill in the boxes in column B, then click "Check".',
            rounding: 'Amounts are rounded to the cent: their sum may differ by $0.01.',
        }
    };

    // Order of the rows, from listed price down to final price
    const ROWS = ['aff', 'rab', 'pre', 'tps', 'tvq', 'fin'];

    const state = {
        lang: Langue.lang,      // shared language, see commun/langue.js
        rabais: 0,              // %
        tps: DEFAULT_TAXES.tps, // %
        tvq: DEFAULT_TAXES.tvq, // %
        bMode: 'aff',           // reference price for both products: 'aff' (listed price) or 'fin' (final price)
        bValue: 45,             // $
        mode: 'observe',        // 'observe' | 'calc'
        answers: {},            // typed amounts for B in calc mode
        checked: false,
        reveal: false,
        method: false,
    };

    const $ = id => document.getElementById(id);
    const s = () => STR[state.lang];
    const round2 = n => Math.round(n * 100) / 100;
    const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
    const locale = () => state.lang === 'fr' ? 'fr-CA' : 'en-CA';

    function money(n) {
        return round2(n).toLocaleString(locale(), { style: 'currency', currency: 'CAD' });
    }
    function num(n, maxDec) {
        return n.toLocaleString(locale(), { maximumFractionDigits: maxDec });
    }
    // Value shown in a text field: decimal comma in French, point in English
    function inputVal(n, maxDec) {
        const str = String(Math.round(n * 10 ** maxDec) / 10 ** maxDec);
        return state.lang === 'fr' ? str.replace('.', ',') : str;
    }
    // Accepts "12,5" and "12.5" with at most maxDec decimals; NaN otherwise
    function parseNum(str, maxDec) {
        const t = str.trim().replace(',', '.');
        const re = new RegExp(`^(\\d+\\.?\\d{0,${maxDec}}|\\.\\d{1,${maxDec}})$`);
        return re.test(t) ? Number(t) : NaN;
    }
    function limitDecimals(input, maxDec) {
        const cut = input.value.replace(new RegExp(`([.,]\\d{${maxDec}})\\d+`), '$1');
        if (cut !== input.value) input.value = cut;
    }

    // All the amounts of a product, from either its final price or its listed price.
    // Both taxes are computed on the price after the discount (Quebec rule).
    function parts(given, kind) {
        const r = state.rabais / 100, t1 = state.tps / 100, t2 = state.tvq / 100;
        const k = 1 + t1 + t2;
        let pre;
        if (kind === 'fin') pre = given / k;
        else pre = given * (1 - r);
        const aff = pre / (1 - r);
        return { aff, rab: aff - pre, pre, tps: pre * t1, tvq: pre * t2, fin: pre * k };
    }

    // ── Static text ──
    function applyLang() {
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const v = s()[el.dataset.i18n];
            if (typeof v === 'string') el.textContent = v;
        });
        document.querySelectorAll('[data-i18n-html]').forEach(el => {
            el.innerHTML = s()[el.dataset.i18nHtml];
        });
        document.title = s().title.replace(/^\S+\s/, '') + ' – LaboMath';
        syncInputs();
        render();
    }

    function syncInputs(source) {
        if (source !== 'inRabais') $('inRabais').value = inputVal(state.rabais, 2);
        if (source !== 'inTps') $('inTps').value = inputVal(state.tps, 3);
        if (source !== 'inTvq') $('inTvq').value = inputVal(state.tvq, 3);
        if (source !== 'inB') $('inB').value = inputVal(state.bValue, 2);
    }

    // ── Columns ──
    // The column holds every part: before-tax price, both taxes and the discount.
    // Reference = final price: taxes on the price, discount hatched on top, outline = final price.
    // Reference = listed price: discount hatched on the price, taxes on top, outline = listed price.
    function renderStack(id, p, hideB) {
        const stack = $(id);
        const area = stack.parentElement;
        const all = p.pre + p.tps + p.tvq + p.rab;
        const h = v => v / all * 100;              // amount → % of area height
        const order = state.bMode === 'fin' ? ['pre', 'tps', 'tvq', 'rab'] : ['pre', 'rab', 'tps', 'tvq'];
        const outline = h(p[state.bMode]);
        const areaPx = area.clientHeight || 0;
        const amount = (key, v) => key === 'rab' && round2(v) > 0 ? '−' + money(v) : money(v);
        const label = (key, v) => `${s().seg[key]} <br>${hideB ? '?' : amount(key, v)}`; // space kept when <br> is hidden

        let bottom = 0;
        const segs = order.map(key => {
            const g = { key, bottom, height: h(p[key]) };
            bottom += g.height;
            return g;
        });
        stack.innerHTML = segs.filter(g => g.height > 0).map(g => {
            const tiny = g.height / 100 * areaPx < 30 ? ' tiny' : '';
            const top = g.key === order[order.length - 1] ? ' top' : '';
            return `<div class="seg ${g.key}${tiny}${top}" style="bottom:${g.bottom}%;height:${g.height}%"><span>${label(g.key, p[g.key])}</span></div>`;
        }).join('') + `<div class="final-box" style="height:calc(${outline}% + 3px)"></div>`;
    }

    // ── Table ──
    function rowLabel(key) {
        const r = s().rows[key];
        if (key === 'rab') return r(num(state.rabais, 2));
        if (key === 'tps') return r(num(state.tps, 3));
        if (key === 'tvq') return r(num(state.tvq, 3));
        return r;
    }

    function renderTable(A, B) {
        const calc = state.mode === 'calc';
        const signed = (key, v) => key === 'rab' && round2(v) > 0 ? '−' + money(v) : money(v);
        let html = `<tr><th>${s().colItem}</th><th>${s().productA}</th><th>${s().productBTitle}</th><th>${s().colShare(s().refName[state.bMode])}</th></tr>`;
        ROWS.forEach(key => {
            let bCell;
            if (key === state.bMode) {
                bCell = `<td class="given">${money(B[key])}</td>`;
            } else if (calc && !state.reveal) {
                const v = state.answers[key] || '';
                bCell = `<td><input type="text" inputmode="decimal" class="num-input" data-key="${key}" value="${v}"><span class="mark" data-mark="${key}"></span></td>`;
            } else {
                bCell = `<td>${signed(key, B[key])}</td>`;
            }
            html += `<tr class="${key === 'fin' ? 'total' : ''}">
                <td><span class="swatch ${key}"></span>${rowLabel(key)}</td>
                <td>${signed(key, A[key])}</td>
                ${bCell}
                <td class="pct">${num(A[key], 3)} %</td>
            </tr>`;
        });
        $('table').innerHTML = html;
    }

    // ── Calculate mode ──
    function unknownKeys() {
        return ROWS.filter(k => k !== state.bMode);
    }

    function markAnswers(B) {
        let good = 0, filled = 0;
        unknownKeys().forEach(key => {
            const input = document.querySelector(`input[data-key="${key}"]`);
            const mark = document.querySelector(`[data-mark="${key}"]`);
            const v = parseNum(state.answers[key] || '', 2);
            input.classList.remove('ok', 'bad');
            mark.textContent = '';
            if (isNaN(v)) return;
            filled++;
            const ok = Math.abs(v - round2(B[key])) <= TOL;
            if (ok) good++;
            input.classList.add(ok ? 'ok' : 'bad');
            mark.textContent = ok ? '✓' : '✗';
            mark.style.color = ok ? '#27ae60' : '#e74c3c';
        });
        return { good, filled, total: unknownKeys().length };
    }

    function renderCalcZone(A, B) {
        const zone = $('calcZone');
        if (state.mode !== 'calc') { zone.innerHTML = ''; return; }

        let html = `<div class="calc-actions">
            ${state.reveal ? '' : `<button class="small-btn primary" data-action="check">${s().check}</button>`}
            <button class="small-btn" data-action="reveal">${state.reveal ? s().hide : s().reveal}</button>
            <button class="small-btn" data-action="method">${state.method ? s().methodHide : s().methodShow}</button>
        </div>`;

        if (state.method) {
            const refB = B[state.bMode];
            html += `<div class="method">${s().method(s().refName[state.bMode], num(A.tvq, 3), money(refB), money(A.tvq / 100 * refB))}</div>`;
        }

        if (state.checked && !state.reveal) {
            const r = markAnswers(B);
            if (r.filled === 0) html += `<div class="feedback bad">${s().empty}</div>`;
            else if (r.good === r.total) html += `<div class="feedback good">${s().allGood}</div>`;
            else html += `<div class="feedback bad">${s().someBad(r.good, r.total)}</div>`;
        }
        zone.innerHTML = html;
    }

    // ── Main render ──
    function render() {
        const ref = state.bMode;                    // A's reference price (final or listed) is 100 $
        const A = parts(100, ref);
        const B = parts(state.bValue, state.bMode);
        const hideB = state.mode === 'calc' && !state.reveal;

        // Both columns have the same size: only the heights (the shares) matter
        renderStack('stackA', A, false);
        renderStack('stackB', B, hideB);

        // Under each column: the reference price, which is given for both products
        const refLabel = s().rows[ref];
        $('totalA').innerHTML = s().total(refLabel, money(A[ref]));
        $('totalB').innerHTML = s().total(refLabel, money(B[ref]));
        $('concept').innerHTML = s().concept(s().refName[ref]);

        document.querySelectorAll('#bModeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.bMode));
        document.querySelectorAll('#modeToggle button').forEach(b => b.classList.toggle('active', b.dataset.mode === state.mode));

        renderTable(A, B);
        renderCalcZone(A, B);

        const rate = state.tps + state.tvq;
        const share = A.tps + A.tvq;                // taxes as a % of the reference price
        $('insight').innerHTML = (rate === 0 ? s().insightNone : Math.abs(share - rate) < 1e-9
                ? s().insightSame(num(rate, 3), s().refName[ref])
                : s().insight(num(rate, 3), num(share, 2), s().refName[ref])) +
            `<br><small>${s().rounding}</small>`;
    }

    // Any change to the data clears the student's answers
    function resetAnswers() {
        state.answers = {};
        state.checked = false;
        state.reveal = false;
    }

    // ── Inputs ──
    function bindNumber(id, maxDec, ok, apply) {
        $(id).addEventListener('input', e => {
            limitDecimals(e.target, maxDec);
            const v = parseNum(e.target.value, maxDec);
            const valid = !isNaN(v) && ok(v);
            e.target.classList.toggle('invalid', !valid);
            if (valid) { apply(v); resetAnswers(); syncInputs(id); render(); }
        });
        $(id).addEventListener('blur', e => {
            e.target.classList.remove('invalid');
            syncInputs();
        });
    }
    bindNumber('inRabais', 2, v => v <= MAX_RABAIS, v => { state.rabais = v; });
    bindNumber('inTps', 3, v => v <= 30, v => { state.tps = v; });
    bindNumber('inTvq', 3, v => v <= 30, v => { state.tvq = v; });
    bindNumber('inB', 2, v => v > 0 && v <= 100000, v => { state.bValue = v; });

    function setTaxes(tps, tvq) {
        state.tps = tps;
        state.tvq = tvq;
        resetAnswers(); syncInputs(); render();
    }
    $('quebecBtn').addEventListener('click', () => setTaxes(QUEBEC_TAXES.tps, QUEBEC_TAXES.tvq));
    $('noTaxesBtn').addEventListener('click', () => setTaxes(0, 0));

    $('bModeToggle').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b || b.dataset.mode === state.bMode) return;
        // Keep the same product: switch the given value to the other kind of price
        const B = parts(state.bValue, state.bMode);
        state.bMode = b.dataset.mode;
        state.bValue = round2(B[state.bMode]);
        resetAnswers(); syncInputs(); render();
    });

    $('modeToggle').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        state.mode = b.dataset.mode;
        resetAnswers(); render();
    });

    // Typed answers are kept in the state without redrawing (so typing isn't interrupted)
    $('table').addEventListener('input', e => {
        const key = e.target.dataset.key;
        if (!key) return;
        limitDecimals(e.target, 2);
        state.answers[key] = e.target.value;
        e.target.classList.remove('ok', 'bad');
    });

    $('calcZone').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (!b) return;
        if (b.dataset.action === 'check') state.checked = true;
        if (b.dataset.action === 'reveal') state.reveal = !state.reveal;
        if (b.dataset.action === 'method') state.method = !state.method;
        render();
    });

    // Redraw labels if the layout height changes (phone rotation, etc.)
    window.addEventListener('resize', () => render());

    // The header's FR/EN button is handled by commun/langue.js
    Langue.onChange(lang => { state.lang = lang; applyLang(); });
    applyLang();
</script>

</body>
</html>
